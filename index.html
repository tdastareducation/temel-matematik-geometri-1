add(6,`<h2 class="h1">5. SAYI PROBLEMLERİ</h2>
<p>Bu bölümde sayılarla ilgili problemleri nasıl çözebileceğimizi öğreneceğiz.</p>
<p>İlk adım olarak sayı problemlerinde hangi sözcüklerin 4 işlemin karşılığı olduğunu öğrenmeliyiz.</p>
<h3 class="h2">5.1. “Fazla” – Toplama</h3>
<p><b class="t">TANIM 1:</b> “fazla” toplama işlemini gösterir. “Bir sayıdan bir sayı fazla” ifadesi, soldaki sayıya sağdaki sayıyı “eklemek” anlamına gelir.</p>
${E('“soldaki sayıdan sağdaki sayı kadar fazla”<br>7\'den 4 fazla → 7 + 4 = 11<br>13\'ten 6 fazla → 13 + 6 = 19<br>19\'dan –7 fazla → 19 + – 7 = 19 – 7 = 12')}
${I('Toplamada sayıların sırası sonucu değiştirmez: 7\'den 4 fazla = 7 + 4 = 4 + 7 = 11.')}
<h3 class="h2">5.2. “Eksik” – Çıkarma</h3>
<p><b class="t">TANIM 2:</b> “eksik” çıkarma işlemini gösterir. “Bir sayıdan bir sayı eksik” ifadesi, soldaki sayıdan sağdaki sayıyı “çıkarmak” anlamına gelir.</p>
<p>Örneğin “10'dan 3 eksik” 10 – 3 = 7 demektir.</p>
${E('“soldaki sayıdan sağdaki sayı kadar eksik”<br>11\'den 5 eksik → 11 – 5 = 6<br>17\'den 3 eksik → 17 – 3 = 14<br>4\'ten –7 eksik → 4 – – 7 = 4 + 7 = 11<br>–15\'ten –4 eksik → –15 – – 4 = –15 + 4 = –11')}
${W('Çıkarmada sıra önemlidir. “11\'den 5 eksik” 11 – 5 = 6\'dır, 5 – 11 <u>değildir</u> 5 – 11.')}`,'5. Sayı Problemleri',1);
P[P.length-1].sub=[['5.1. “Fazla” – Toplama',2],['5.2. “Eksik” – Çıkarma',2]];

add(6,`<h3 class="h2">5.3. “Bir sayının kesri” – Çarpma ve Bölme</h3>
<p><b class="t">TANIM 3:</b> “bir sayının kesri” çarpma ve bölme işlemlerini gösterir. “Bir sayının kesri” ifadesi, sayıyı paydaya “bölmek” ve sonucu payla “çarpmak” ya da sayıyı payla “çarpıp” mümkünse kesri sadeleştirmek anlamına gelir.</p>

add(6,`<h3 class="h2">5.5. Bilinmeyen Bir Sayıyı Bulma</h3>
<p><b class="t">TANIM 5:</b> An <b>Bilinmeyen sayı</b>, henüz bilmediğimiz bir sayıdır. Problemlerde genellikle “bir sayı” olarak yazılır. Bu sayının yerine bir harf, genellikle <b>x</b> yazarız. Sonra cümleyi bir <b>denkleme</b> dönüştürür ve bilinmeyen sayıyı bulmak için çözeriz.</p>

${I(`Sözcükleri matematiğe nasıl yazarız:<br>“bir sayıya 7 eklenmesi” ya da “bir sayının 7 fazlası” → x + 7<br>“bir sayıdan 5 çıkarılması” ya da “bir sayının 5 eksiği” → x – 5<br>“bir sayının 4 ile çarpımı” ya da “bir sayının 4 katı” → 4x<br>“bir sayının 3'e bölümü” → ${fr('x',3)}<br>“bir sayının 2 katı” → 2x, “bir sayının yarısı” → ${fr('x',2)}<br>“bir sayının ${fr(2,3)}'si” → ${fr('2x',3)}, “… 12'dir” → = 12`)}
${R(`Bilinmeyen sayıyı bulmak için <b>ters işlemi</b> kullanırız. Toplama ile çıkarma birbirinin ters işlemidir; çarpma ile bölme de birbirinin ters işlemidir.<br>x + a = b → x = b – a<br>x – a = b → x = b + a<br>a · x = b → x = b ÷ a<br>${fr('x','a')} = b → x = b · a<br>İki adımlı problemlerde önce toplama ya da çıkarmayı, sonra çarpma ya da bölmeyi geri al.`)}

add(6,`${E(`Bir sayının 3 ile çarpılıp sonra 5 eklenmesiyle elde edilen sonuç 26'dır. Sayıyı bulunuz.<br>Denklem: 3x + 5 = 26<br>Toplamayı geri al: 3x = 26 – 5 = 21<br>Çarpmayı geri al: x = ${fr(21,3)} = <b>7</b>`,'Örnek 5:')}

/* ---------- speech ---------- */
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function mathSpeak(t){
 t=t.replace(/m\(∠\s*([A-Z]{1,3})\)/g,' $1 açısı ').replace(/∠\s*/g,' açı ').replace(/⊥/g,' dik ').replace(/∥/g,' paralel ').replace(/°/g,' derece').replace(/⇒/g,', yani ').replace(/d₁/g,'d bir').replace(/d₂/g,'d iki').replace(/d₃/g,'d üç').replace(/\|([A-Z]{2})\|/g,'$1').replace(/∈/g,' üzerinde ').replace(/(\d)x\b/g,'$1 x').replace(/[✓✔]/g,'');
 t=t.replace(/([0-9)\]}⁰¹²³⁴⁵⁶⁷⁸⁹]\s*)=/g,'$1,=');
 t=t.replace(/\b(1\d{3}|[5-9]\d{2})\s*[–-]\s*(y\.\s*)?(1\d{3}|[5-9]\d{2})\b/g,(m,a,c,b)=>`${a} ile ${c?'yaklaşık ':''}${b} arası`);
 t=t.replace(/(?<![0-9x])\s[·–—]\s+(?=[A-Za-zÇĞİÖŞÜçğıöşü“"‘]{2,})/g,', ').replace(/—/g,', ').replace(/\b([A-D])\)\s/g,'$1, ');
 t=t.replace(/\((\d{3,4})\)/g,', $1,').replace(/\(([^()]*[A-Za-zÇĞİÖŞÜçğıöşü]{2,}[^()]*)\)/g,', $1,');
 t=t.replace(/\{([^{}]*,[^{}]*)\}/g,' $1 kümesi ').replace(/\.\.\.|…/g,' ve böyle devam eder ');
 t=t.replace(/•/g,' ').replace(/(\d)\s*\/\s*(\d)/g,'$1 bölü $2').replace(/π/g,' pi ').replace(/∞/g,' sonsuz ').replace(/^\s*=/,' Bu, şuna eşittir: ').replace(/\n\s*=/g,'\n Bu, şuna eşittir: ');
 t=t.replace(/([0-9)\]}⁰¹²³⁴⁵⁶⁷⁸⁹])[ \t]+\.[ \t]+(?=[–−+(\[{\d√])/g,'$1 × ').replace(/([0-9)\]}⁰¹²³⁴⁵⁶⁷⁸⁹])[ \t]*:[ \t]*(?=[–−+(\[{\d√])/g,'$1 ÷ ');
 t=t.replace(/[“"‘]((?:[\s+\-–×÷.:]|ve)+)[”"’]/g,(m,x)=>' '+x.trim().split(/\s+/).map(c=>({'+':'artı','–':'eksi','-':'eksi','×':'çarpı','.':'nokta','÷':'bölme',':':'iki nokta'}[c]||c)).join(' ')+(/ve/.test(x)?' işaretleri ':' işareti '));
 t=t.replace(/\(\s*[–−]\s*\)/g,' negatif ').replace(/\(\s*\+\s*\)/g,' pozitif ');
 t=t.replace(/²√/g,'√');
 let o='';const isB=c=>/[0-9)\]}⁰-⁹²³¹]/.test(c);
 for(let i=0;i<t.length;i++){const c=t[i];if(c==='–'||c==='−'||c==='+'){const pv=o.replace(/\s+$/,'').slice(-1);const pw=(o.replace(/\s+$/,'').match(/([A-Za-z]+)$/)||[''])[0];const bin=isB(pv)||/^(x|y|k|a|b|c|derece|[A-Z]{1,3})$/.test(pw);o+=c==='+'?(bin?' artı ':' pozitif '):(bin?' eksi ':' negatif ');}else o+=c}
 t=o;
 t=t.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>SUP.indexOf(c)).join(''));
 t=t.replace(/\^(\d+)/g,(m,n)=>n==='2'?' kare ':n==='3'?' küp ':` üssü ${n} `).replace(/\^/g,'');
 t=t.replace(/√\s*(\d+)/g,'karekök $1').replace(/√\s*\(/g,'karekök (').replace(/√\s*(negatif|pozitif)/g,'karekök $1').replace(/√/g,' karekök ');
 t=t.replace(/[×·]/g,' çarpı ').replace(/÷/g,' bölü ');
 t=t.replace(/=/g,' eşittir ').replace(/\(/g,' parantez aç ').replace(/\)/g,' parantez kapa ').replace(/\[/g,' köşeli parantez aç ').replace(/\]/g,' köşeli parantez kapa ').replace(/\{/g,' süslü parantez aç ').replace(/\}/g,' süslü parantez kapa ');
 t=t.replace(/[“”"⟶⟵→←↑↓…]/g,' ').replace(/;/g,',').replace(/›/g,' büyüktür ').replace(/‹/g,' küçüktür ');
 return t.replace(/\n/g,'. ').replace(/([.,]\s*),/g,'$1').replace(/,\s*\./g,'.').replace(/^[\s,.]+/,'').replace(/\s+([.,])/g,'$1').replace(/\.(\s*\.)+/g,'.').replace(/\s{2,}/g,' ').trim();
}
function boxText(el){
 const c=el.cloneNode(true);c.querySelectorAll('.bsay,.hsay,.psay,.csay,button,.nosay,.mini').forEach(x=>x.remove());c.querySelectorAll('svg').forEach(x=>x.replaceWith('\n'));

 c.querySelectorAll('.fr').forEach(x=>{const s=x.children;x.replaceWith(` ${s[0].textContent} bölü ${s[1].textContent} `)});
 c.querySelectorAll('sup').forEach(x=>{const v=x.textContent.trim();x.replaceWith(/^\d+$/.test(v)?[...v].map(d=>SUP[d]).join(''):v==='+'?' artı ':/[–−-]/.test(v)?' eksi ':v)});
 [...c.querySelectorAll('.rad')].reverse().forEach(x=>{const ri=x.querySelector('.ri').textContent.trim();x.replaceWith(/[+–×÷:·.\s]/.test(ri)?` √(${ri}) `:` √${ri} `)});
 c.querySelectorAll('br').forEach(x=>x.replaceWith('\n'));c.querySelectorAll('h1,h2,h3,h4,h5,li,div,p,td').forEach(x=>x.append('\n'));
 return mathSpeak(c.textContent.replace(/^\s*(Örnek|KURAL|BİLGİ|DİKKAT|İPUCU|Çözüm)\s*[:;]/,'$1. '));
}
let voice=null,trWarned=false;

function pickVoice(){try{const v=trVoices();let saved=null;try{saved=localStorage.getItem('emg1-voice')}catch(e){}
 voice=(saved&&v.find(x=>x.voiceURI===saved))||v.find(x=>/Natural|Neural|Online|Google|Enhanced|Premium/i.test(x.name))||v[0]||null;fillVoiceSel(v)}catch(e){}}
function fillVoiceSel(v){const s=document.getElementById('vsel'),n=document.getElementById('vnote');if(!s)return;

/* ---------- "x =" inside the answer box; slanted parallel sign ---------- */
document.querySelectorAll('.xl').forEach(l=>{const g=l.nextElementSibling;if(!g||!g.matches('input.g'))return;const w=document.createElement('span');w.className='xin';l.before(w);w.append(l,g)});
const PAR=(()=>{const wrap=root=>{const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.includes('∥')&&!(n.parentElement&&n.parentElement.closest('.par,script,style,textarea'))?1:3});const L=[];while(tw.nextNode())L.push(tw.currentNode);
  L.forEach(n=>{const f=document.createDocumentFragment();n.nodeValue.split('∥').forEach((t,i)=>{if(i){const s=document.createElement('span');s.className='par';s.textContent='∥';f.append(s)}if(t)f.append(t)});n.replaceWith(f)})};
 wrap(document.body);new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)wrap(n);else if(n.nodeType===3&&n.parentNode&&n.nodeValue.includes('∥'))wrap(n.parentNode)}))).observe(document.body,{childList:true,subtree:true});return{wrap}})();

/* ---------- navigation ---------- */
const pages=[...document.querySelectorAll('.page')];let cur=-1;
function go(i,dir){i=Math.max(0,Math.min(pages.length-1,i));if(i===cur)return;stopTalk();const back=cur>i;
 if(cur>=0)pages[cur].classList.remove('on','fn','fp');cur=i;const p=pages[i];p.classList.add('on',back?'fp':'fn');
 p.querySelectorAll('svg.nl').forEach(s=>{if(!s.classList.contains('hid')||s.classList.contains('rev'))replay(s)});
 BGFX.theme(P[i].ch);document.documentElement.style.setProperty('--logo',TH[P[i].ch][2]);document.getElementById('pg').textContent=`${i+1} / ${pages.length}`;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===pages.length-1;
 document.querySelectorAll('#toc a').forEach(a=>a.classList.toggle('cur',+a.dataset.go===i));
 window.scrollTo({top:0});S.page=i;save();history.replaceState(null,'','#'+(i+1));closeD();setTimeout(()=>WB.onPage(),30)}
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
const openD=()=>{drawer.classList.add('open');scrim.classList.add('open')},closeD=()=>{drawer.classList.remove('open');scrim.classList.remove('open')};
document.getElementById('menuBtn').onclick=openD;document.getElementById('pg').onclick=openD;scrim.onclick=closeD;
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('home').onclick=()=>go(P.findIndex(p=>p.html.includes('id="contents"')));
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(+a.dataset.go)}});
document.addEventListener('keydown',e=>{if(e.target.matches('input')||!document.getElementById('vid').hidden||!document.getElementById('solp').hidden)return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Escape')closeD()});
let tx=0,ty=0;book.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',e=>{if(e.target.closest('input,button,svg')||WB.active())return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dy)<45)go(cur+(dx<0?1:-1))},{passive:true});
const h=parseInt(location.hash.slice(1));go(h>0?h-1:(S.page||0));
