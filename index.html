:root{--bg:#e8eef3;--ink:#1d2433;--muted:#5b6475;--paper:#fff;--c:#2e9e3a;--c2:#e9f6ea;--cd:#1d6b25;--ok:#19a34a;--bad:#e03131;--pur:#7b4fc9;--pur2:#f3eefc;--tea:#1497a8;--tea2:#e3f5f7}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);transition:background-color .8s ease;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16.5px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
.say,.bsay,.hsay,.psay,.csay,.spd,#vnote,#rpop{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.08)}
.top .ttl{flex:1;font-family:'Lilita One',sans-serif;font-size:19px;color:#1d6b25;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl svg{width:33px;height:28px;flex:none}
.ib{border:0;background:#eef2f6;border-radius:10px;padding:7px 11px;font-weight:800;color:var(--ink)}
#pg{font-weight:800;color:var(--muted);font-size:14px;white-space:nowrap}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:#fff;z-index:40;transform:translateX(-102%);transition:transform .25s;overflow:auto;padding:16px;box-shadow:4px 0 24px rgba(0,0,0,.15)}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
#scrim.open{display:block}
#drawer h3{font-family:'Lilita One';color:#1d6b25;margin:4px 0 6px;font-size:22px}
#score{background:#e9f6ea;border-radius:12px;padding:10px 12px;margin:8px 0 14px;font-weight:700}
#score .bar{height:8px;background:#cfe9d3;border-radius:9px;margin-top:6px;overflow:hidden}
#score .bar i{display:block;height:100%;background:var(--ok);width:0}
.tocl a{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:700}
.tocl a:hover{background:#f1f4f7}
.tocl a.l1{padding-left:22px;font-weight:600;color:#3a4252}
.tocl a.l2{padding-left:36px;font-weight:600;color:#5b6475;font-size:15px}
.tocl a.ch{margin-top:8px;color:var(--cd)}
.tocl a.cur{background:#e9f6ea}
.book{max-width:820px;margin:0 auto;padding:14px 12px 96px;perspective:1800px;position:relative;z-index:1}
#bgfx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}
.page{background:rgba(255,255,255,.88)!important}
@media(max-width:700px){.page{background:rgba(255,255,255,.8)!important}.box{background-clip:padding-box}}
.page .cover,.page .back{background-color:#2fa33a}
.fxsw{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:-4px 0 12px;cursor:pointer}
.fxsw input{width:18px;height:18px;accent-color:#1d6b25}
.page{display:none;background:var(--paper);border-radius:16px;box-shadow:0 6px 28px rgba(20,40,60,.13);min-height:72vh;position:relative;overflow:hidden;padding-bottom:46px}
.page.on{display:block}
.page.fn{animation:fn .45s ease both;transform-origin:left center}
.page.fp{animation:fp .45s ease both;transform-origin:right center}
@keyframes fn{from{opacity:0;transform:rotateY(-28deg) translateX(30px)}to{opacity:1;transform:none}}
@keyframes fp{from{opacity:0;transform:rotateY(28deg) translateX(-30px)}to{opacity:1;transform:none}}
.band{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 0 0;border-bottom:3px solid var(--c2)}
.band span{background:var(--c);color:#fff;font-family:'Lilita One';letter-spacing:.5px;padding:10px 26px 10px 20px;border-radius:0 0 40px 0;font-size:clamp(15px,3.6vw,22px)}
.band em{font-style:normal;font-size:11px;letter-spacing:2px;color:#9aa3b1;font-weight:800;text-transform:uppercase;white-space:nowrap}
.pc{padding:18px clamp(16px,4.5vw,44px) 10px}
.pno{position:absolute;bottom:12px;left:0;right:0;display:flex;align-items:center;gap:12px;padding:0 40px}
.pno:before,.pno:after{content:"";flex:1;height:3px;background:var(--c);border-radius:3px;opacity:.8}
.pno b{background:var(--c);color:#fff;padding:2px 14px;border-radius:4px;font-size:15px}
p{margin:.55em 0}
.ctr{text-align:center;font-weight:700;font-size:1.05em}
h2.h1{font-family:'Lilita One';color:var(--cd);text-align:center;font-weight:400;font-size:clamp(24px,5.5vw,34px);margin:6px 0 12px;border-bottom:3px solid var(--c);padding-bottom:6px}
h3.h2{color:var(--cd);font-size:21px;margin:18px 0 8px;border-bottom:2px solid var(--c);padding-bottom:3px}
h4.h3{color:var(--cd);margin:14px 0 6px;font-size:17.5px}
.t{color:var(--cd)}
.pill{display:block;width:max-content;max-width:100%;margin:6px auto 14px;border:4px solid var(--c);border-radius:20px;padding:5px 26px;font-weight:900;letter-spacing:3px;color:var(--cd);text-transform:uppercase;font-size:15px;outline:1.5px dashed var(--c);outline-offset:-9px;text-align:center}
.box{border-radius:6px;margin:10px 0;padding:10px 14px 10px 54px;position:relative;min-height:44px}
.box:before{position:absolute;left:0;top:0;bottom:0;width:40px;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;color:#fff;font-weight:900}
.exm{background:var(--pur2);border:2px solid var(--pur)}
.exm:before{content:"✎";background:var(--pur);font-size:18px}
.exm>b:first-child{color:var(--pur)}
.inf{background:var(--tea2);border:2px dashed var(--tea)}
.inf:before{content:"i";background:var(--tea);font-family:Georgia,serif;font-size:20px}
.inf>b:first-child{color:var(--tea)}
.rul{background:#e7f2fd;border:2px solid #2d9ae8}
.rul:before{content:"≡";background:#2d9ae8;font-size:20px}
.rul>b:first-child{color:#1150b0}
.wrn{background:#fdeceb;border:2px solid var(--bad)}
.wrn:before{content:"⚠";background:var(--bad);font-size:18px}
.wrn>b:first-child{color:var(--bad)}

tir.;;x + 5x = 180° ⇒ 6x = 180°;;x = 30°", "f": "f157_4"}], "ch": 6}, {"n": 3, "title": "‘Ters Açılar’", "qs": [{"n": 1, "t": "Kesişen iki doğru veriliyor. x kaç derecedir?", "o": {"A": "38°", "B": "132°", "C": "142°", "D": "152°"}, "a": "C", "s": "x ile 38° bir doğru üzerindeki komşu açılardır.;;x + 38° = 180°;;x = 142°", "f": "f158_1"}, {"n": 2, "t": "AB ve CD doğruları O noktasında kesişiyor. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "İşaretli açılar ters açılar olduğundan eşittir.;;4x – 15° = 2x + 25°;;2x = 40° ⇒ x = 20", "f": "f158_2"}, {"n": 3, "t": "Kesişen iki doğru veriliyor. y kaç derecedir?", "o": {"A": "36°", "B": "72°", "C": "82°", "D": "108°"}, "a": "B", "s": "Komşu açılar: 3x + 2x = 180° ⇒ 5x = 180° ⇒ x = 36°;;y ile 2x ters açılardır.;;y = 2x = 72°", "f": "f158_3"}, {"n": 4, "t": "Üç doğru O noktasında kesişiyor. x kaç derecedir?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "75°"}, "a": "D", "s": "65°'nin ters açısı da 65°'dir; bu açı x'in yanındadır.;;Doğru açı: 65° + x + 40° = 180°;;x = 75°", "f": "f158_4"}, {"n": 5, "t": "Kesişen iki doğrunun oluşturduğu açılar a, b, c ve d'dir. a – b = 60° ise c kaç derecedir?", "o": {"A": "120°", "B": "130°", "C": "140°", "D": "150°"}, "a": "A", "s": "Komşu açılar: a + b = 180° ve a – b = 60°.;;2a = 240° ⇒ a = 120°;;c ile a ters açılardır: c = 120°", "f": "f159_1"}, {"n": 6, "t": "AB ve CD doğruları O noktasında kesişiyor. OE ⊥ AB ve m(∠BOD) = 50° ise x kaç derecedir?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "C", "s": "Ters açılar: m(∠AOC) = m(∠BOD) = 50°.;;OE ⊥ AB olduğundan m(∠AOE) = 90°'dir.;;x = 90° – 50° = 40°", "f": "f159_2"}, {"n": 7, "t": "İki doğru kesişiyor. y kaç derecedir?", "o": {"A": "90°", "B": "100°", "C": "110°", "D": "120°"}, "a": "C", "s": "Ters açılar: 4x – 10° = 2x + 30° ⇒ x = 20;;Yani bu açı 4 · 20° – 10° = 70°'dir.;;y onun komşu açısıdır: y = 180° – 70° = 110°", "f": "f159_3"}, {"n": 8, "t": "Üç doğru O noktasında kesişiyor. x 70° ⇒ x = 30", "f": "f161_3"}, {"n": 8, "t": "O noktası etrafındaki açılar veriliyor. x kaç derecedir?", "o": {"A": "75°", "B": "85°", "C": "95°", "D": "105°"}, "a": "B", "s": "95° + 70° + x + 110° = 360°;;275° + x = 360°;;x = 85°", "f": "f161_4"}], "ch": 6}, {"n": 5, "title": "‘Açıortay’", "qs": [{"n": 1, "t": "[OC ışını ∠AOB'nin açıortayıdır ve m(∠AOB) = 126°'dir. x kaç derecedir?", "o": {"A": "63°", "B": "73°", "C": "83°", "D": "126°"}, "a": "A", "s": "Açıortay açıyı iki eşit parçaya böler.;;x = 126° ÷ 2 = 63°", "f": "f162_1"}, {"n": 2, "t": "[OC ışını ∠AOB'nin açıortayıdır. x'i bulunuz.", "o": {"A": "10", "B": "15", "C": "20", "D": "25"}, "a": "B", "s": "Açıortayla bölünen açının iki parçası eşittir.;;2x + 20° = 4x – 10°;;30° = 2x ⇒ x = 15", "f": "f162_2"}, {"n": 3, "t": "A, O ve B doğrusaldır; [OD ışını ∠BOC'nin açıortayıdır ve m(∠AOD) = 130°'dir. m(∠AOC) kaçtır?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "80°"}, "a": "D", "s": "m(∠DOB) = 180° – 130° = 50°;;OD açıortaydır: m(∠BOC) = 2 · 50° = 100°;;m(∠AOC) = 180° – 100° = 80°", "f": "f162_3"}, {"n": 4, "t": "A, O ve B doğrusaldır; [OK ve [OL ışınları ∠BOC ile ∠COA'nın açıortaylarıdır. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "C", "s": "Komşu bütünler açıların açıortayları arasındaki açı 90°'dir.;;(3x + 10°) + (2x + 5°) = 90°;;5x + 15° = 90° ⇒ x = 15", "f": "f162_4"}, {"n": 5, "t": "OA ⊥ OC; [OD ve [OE ışınları ∠AOB ile ∠BOC'nin açıortaylarıdır. m(∠DOE) kaçtır?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "D", "s": "∠AOB ve ∠BOC komşu tümler açılardır (OA ⊥ OC).;;Açıortayları arasındaki açı 90°'nin yarısıdır.;;m(∠DOE) = 90° ÷ 2 = 45°", "f": "f163_1"}, {"n": 6, "t": "[OB ışını ∠AOC'nin, [OC ışını da ∠BOD'nin açıortayıdır. m(∠AOD) = 114° ise m(∠AOC) kaçtır?", "o": {"A": "76°", "B": "86°", "C": "96°", "D": "106°"}, "a": "A", "s": "m(∠AOB) = m(∠BOC) ve m(∠BOC) = m(∠COD) olduğundan üçü de eşittir.;;3 · m(∠AOB) = 114° ⇒ m(∠AOB) = 38°;;m(∠AOC) = 2 · 38° = 76°", "f": "f163_2"}, {"n": 7, "t": "[OC ışını ∠AOB'nin açıortayıdır. m(∠AOB) kaçtır?", "o": {"A": "76°", "B": "86°", "C": "96°", "D": "106°"}, "a": "A", "s": "İki parça eşittir: 3x – 7° = 2x + 8° ⇒ x = 15;;Her parça: 2 · 15° + 8° = 38°;;m(∠AOB) = 2 · 38° = 76°", "f": "f163_3"}, {"n": 8, "t": "A, O ve B doğrusaldır ve [OD ışını ∠BOC'nin açıortayıdır. x kaçtır?", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "C", "s": "m(∠BOC) = 180° – 50° = 130°;;OD açıortaydır: x = 130° ÷ 2 = 65°", "f": "f163_4"}], "ch": 6}, {"n": 6, "title": "‘Paralel Doğrular ve Bir Kesen’", "qs": [{"n": 1, "t": "d₁ ∥ d₂'dir. x kaç derecedir?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "115°"}, "a": "C", "s": "d₁ ∥ d₂: tüm dar açılar birbirine, tüm geniş açılar da birbirine eşittir.;;115° geniş, x ise dar açıdır; bu yüzden bütünlerdir.;;x = 180° – 115° = 65°", "f": "f164_1"}, {"n": 2, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "İşaretli açılar iç ters açılar olduğundan eşittir.;;5x – 20° = 3x + 20°;;2x = 40° ⇒ x = 20", "f": "f164_2"}, {"n": 3, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "A", "s": "İşaretli açılar karşı durumlu açılar olduğundan bütünlerdir.;;4x + (2x + 30°) = 180°;;6x = 150° ⇒ x = 25", "f": "f164_3"}, {"n": 4, "t": "d₁ ∥ d₂'dir. y kaç derecedir?", "o": {"A": "95°", "B": "105°", "C": "115°", "D": "125°"}, "a": "B", "s": "Dış ters açılar eşittir: 2x + 25° = 4x – 25° ⇒ x = 25;;Yani 2x + 25° = 75°.;;y ile 75° bir doğru üzerindedir: y = 180° – 75° = 105°", "f": "f164_4"}, {"n": 5, "t": "d₁ ∥ d₂ ve a = 2y'dir. y kaç derecedir?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "90°"}, "a": "A", "s": "a geniş, y dar açıdır; bu yüzden a + y = 180°'dir.;;2y + y = 180° ⇒ 3y = 180°;;y = 60°", "f": "f165_1"}, {"n": 6, "t": "d₁ ∥ d₂ ve b – a = 40°'dir. b kaç derecedir?", "o": {"A": "90°", "B": "100°", "C": "110°", "D": "120°"}, "a": "C", "s": "a dar, b geniş açıdır; bu yüzden a + b = 180°'dir.;;b – a = 40° ve b + a = 180°;;2b = 220° ⇒ b = 110°", "f": "f165_2"}, {"n": 7, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "İşaretli açılar yöndeş açılar olduğundan eşittir.;;3x + 20° = 5x – 20°;;40° = 2x ⇒ x = 20", "f": "f165_3"}, {"n": 8, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "D", "s": "İşaretli açılar karşı durumlu açılar olduğundan bütünlerdir.;;(3x + 20°) + (2x + 10°) = 180°;;5x + 30° = 180° ⇒ x = 30", "f": "f165_4"}], "ch": 6}, {"n": 7, "title": "‘Karma Test 1’", "qs": [{"n": 1, "t": "Bir açının tümleri 28°'dir. Bu açının bütünleri kaç derecedir?", "o": {"A": "88°", "B": "98°", "C": "108°", "D": "118°"}, "a": "D", "s": "Açı 90° – 28° = 62°'dir.;;Bütünleri: 180° – 62° = 118°", "f": "f166_1"}, {"n": 2, "t": "Kesişen iki doğru veriliyor. y kaç derecedir?", "o": {"A": "80°", "B": "85°", "C": "90°", "D": "100°"}, "a": "A", "s": "Komşu açılar: 4x + (2x + 30°) = 180° ⇒ 6x = 150° ⇒ x = 25;;y ile (2x + 30°) ters açılardır.;;y = 2 · 25° + 30° = 80°", "f": "f166_2"}, {"n": 3, "t": "O noktası etrafındaki açılar veriliyor. x'i bulunuz.", "o": {"A": "26", "B": "30", "C": "34", "D": "38"}, "a": "C", "s": "Biri dik açı olan, bir nokta etrafındaki açılar:;;2x + 100° + 90° + 3x = 360°;;5x = 170° ⇒ x = 34", "f": "f166_3"}, {"n": 4, "t": "[OC ışını ∠AOB'nin açıortayıdır ve m(∠AOB) = 100°'dir. x'i bulunuz.", "o": {"A": "14", "B": "16", "C": "18", "D": "20"}, "a": "B", "s": "OC açıortay olduğundan m(∠AOC) = 100° ÷ 2 = 50°'dir.;;3x + 2° = 50°;;3x = 48° ⇒ x = 16", "f": "f166_4"}, {"n": 5, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "C", "s": "İşaretli açılar yöndeş açılar olduğundan eşittir.;;2x + 15° = 115°;;2x = 100° ⇒ x = 50", "f": "f167_1"}, {"n": 6, "t": "A, O ve B doğrusaldır ve OD ⊥ AB'dir. m(∠AOC) kaçtır?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "D", "s": "OD ⊥ AB: (x + 15°) + 2x = 90° ⇒ 3x = 75° ⇒ x = 25;;m(∠DOC) = 25° + 15° = 40°;;m(∠AOC) = 90° + 40° = 130°", "f": "f167_2"}, {"n": 7, "t": "İşaretli iki açı bir dik açı oluşturuyor. x'i bulunuz.", "o": {"A": "4", "B": "9", "C": "14", "D": "19"}, "a": "C", "s": "İki açı bir dik açı oluşturur.;;4x + (2x + 6°) = 90°;;6x = 84° ⇒ x = 14", "f": "f167_3"}, {"n": 8, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "A", "s": "İşaretli açılar iç ters açılar olduğundan eşittir.;;4x = 2x + 50°;;2x = 50° ⇒ x = 25", "f": "f167_4"}], "ch": 6}, {"n": 8, "title": "‘Karma Test 2’", "qs": [{"n": 1, "t": "Bir açının bütünleri ile tümlerinin toplamı 200°'dir. Açının ölçüsü kaç derecedir?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "B", "s": "Bütünleri: 180° – x; tümleri: 90° – x.;;(180° – x) + (90° – x) = 200°;;270° – 2x = 200° ⇒ 2x = 70° ⇒ x = 35°", "f": "f168_1"}, {"n": 2, "t": "AB ve CD doğruları O'da kesişiyor. [OE ışını ∠BOD'nin açıortayıdır. m(∠AOC) = 70° ise m(∠AOE) kaçtır?", "o": {"A": "125°", "B": "135°", "C": "145°", "D": "155°"}, "a": "C", "s": "Ters açılar: m(∠BOD) = m(∠AOC) = 70°.;;OE açıortaydır: m(∠BOE) = 70° ÷ 2 = 35°;;m(∠AOE) = 180° – 35° = 145°", "f": "f168_2"}, {"n": 3, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "30", "B": "35", "C": "40", "D": "45"}, "a": "A", "s": "İşaretli açılar karşı durumlu açılar olduğundan bütünlerdir.;;(3x + 20°) + (x + 40°) = 180°;;4x + 60° = 180° ⇒ x = 30", "f": "f168_3"}, {"n": 4, "t": "Üç doğru O noktasında kesişiyor. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "70°'nin ters açısı (x + 40°) ile (2x + 10°) arasındadır.;;Doğru açı: (x + 40°) + 70° + (2x + 10°) = 180°;;3x + 120° = 180° ⇒ x = 20", "f": "f168_4"}, {"n": 5, "t": "OA ⊥ OB ve [OD ışını ∠AOC'nin açıortayıdır. m(∠COB) kaçtır?", "o": {"A": "18°", "B": "28°", "C": "38°", "D": "48°"}, "a": "D", "s": "OD açıortaydır: m(∠AOD) = m(∠DOC) = x + 5°.;;OA ⊥ OB: 3x + 2(x + 5°) = 90° ⇒ 5x = 80° ⇒ x = 16;;m(∠COB) = 3x = 48°", "f": "f169_1"}, {"n": 6, "t": "d₁ ∥ d₂'dir. y kaç derecedir?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "110°"}, "a": "B", "s": "İşaretli açıların ikisi de geniş açı olduğundan eşittir.;;4x – 30° = 2x + 40° ⇒ x = 35 ⇒ açı 110°'dir.;;y dar açıdır: y = 180° – 110° = 70°", "f": "f169_2"}, {"n": 7, "t": "A, O ve B doğrusaldır ve [OD ışını ∠AOC'nin açıortayıdır. x kaçtır?", "o": {"A": "28°", "B": "38°", "C": "48°", "D": "58°"}, "a": "D", "s": "m(∠AOC) = 180° – 64° = 116°;;OD açıortaydır: x = 116° ÷ 2 = 58°", "f": "f169_3"}, {"n": 8, "t": "O noktası etrafında üç açı var. En büyük açının ölçüsü kaç derecedir?", "o": {"A": "155°", "B": "160°", "C": "165°", "D": "170°"}, "a": "B", "s": "Bir nokta etrafındaki açılar: 2x + 4x + 3x = 360°;;9x = 360° ⇒ x = 40°;;En büyük açı: 4x = 160°", "f": "f169_4"}], "ch": 6}, {"n": 9, "title": "‘Karma Test 3’", "qs": [{"n": 1, "t": "AB ve CD doğruları O'da kesişiyor ve OE ⊥ AB'dir. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "Ters açılar: m(∠AOC) = m(∠BOD) = x + 10°.;;OE ⊥ AB: (x + 10°) + 3x = 90°;;4x = 80° ⇒ x = 20", "f": "f170_1"}, {"n": 2, "t": "[OB ışını ∠AOC'nin açıortayıdır. x kaç derecedir?", "o": {"A": "45°", "B": "50°", "C": "55°", "D": "60°"}, "a": "D", "s": "O etrafındaki açılar: m(∠AOC) = 360° – 110° – 130° = 120°;;OB açıortaydır: x = 120° ÷ 2 = 60°", "f": "f170_2"}, {"n": 3, "t": "d₁ ∥ d₂'dir. y kaç derecedir?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "110°"}, "a": "B", "s": "Yöndeş açılar eşittir: 6x – 10° = 4x + 30° ⇒ x = 20;;Yani açı 6 · 20° – 10° = 110°'dir.;;y onunla bir doğru üzerindedir: y = 180° – 110° = 70°", "f": "f170_3"}, {"n": 4, "t": "Bir açının bütünleri, tümlerinin 4 katından 30° eksiktir. Açının ölçüsü kaç derecedir?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "C", "s": "180° – x = 4(90° – x) – 30°;;180° – x = 330° – 4x;;3x = 150° ⇒ x = 50°", "f": "f170_4"}, {"n": 5, "t": "Kesişen iki doğrunun oluşturduğu açılar a, b, c ve d'dir. a + c = 140° ise b kaç derecedir?", "o": {"A": "70°", "B": "110°", "C": "120°", "D": "130°"}, "a": "B", "s": "a ile c ters açılardır: a = c = 140° ÷ 2 = 70°;;b, a'nın komşusudur: b = 180° – 70° = 110°", "f": "f171_1"}, {"n": 6, "t": "A, O ve B doğrusaldır ve [OD ışını ∠COB'nin açıortayıdır. m(∠AOD) kaçtır?", "o": {"A": "140°", "B": "150°", "C": "160°", "D": "170°"}, "a": "A", "s": "OD açıortaydır: m(∠COD) = m(∠DOB) = 2x – 10°.;;4x + 2(2x – 10°) = 180° ⇒ 8x = 200° ⇒ x = 25;;m(∠AOD) = 4x + (2x – 10°) = 100° + 40° = 140°", "f": "f171_2"}, {"n": 7, "t": "İki doğru kesişiyor. y kaç derecedir?", "o": {"A": "120°", "B": "130°", "C": "140°", "D": "150°"}, "a": "A", "s": "Ters açılar: 3x = x + 40° ⇒ x = 20 ⇒ 3x = 60°;;y komşu açıdır: y = 180° – 60° = 120°", "f": "f171_3"}, {"n": 8, "t": "Bir açının bütünleri, tümlerinin 4 katıdır. Açının ölçüsü kaç derecedir?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "70°"}, "a": "C", "s": "180° – x = 4(90° – x);;180° – x = 360° – 4x;;3x = 180° ⇒ x = 60°", "f": "f171_4"}], "ch": 6}, {"n": 10, "title": "‘Karma Test 4’", "qs": [{"n": 1, "t": "AB ve CD doğruları O noktasında kesişiyor. x kaç derecedir?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "Ters açılar: m(∠AOD) = m(∠COB) = 120°.;;∠AOD, x ve 3x'ten oluşur: x + 3x = 120°;;4x = 120° ⇒ x = 30°", "f": "f172_1"}, {"n": 2, "t": "İki tümler açıdan biri, diğerinin 2 katından 15° fazladır. Küçük açı kaç derecedir?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "B", "s": "Küçük açı a olsun; diğeri 2a + 15°'dir.;;a + (2a + 15°) = 90°;;3a = 75° ⇒ a = 25°", "f": "f172_2"}, {"n": 3, "t": "d₁ ∥ d₂ ve [PE ışını işaretli açıyı iki eşit parçaya bölüyor. x kaç derecedir?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "D", "s": "80°'nin P'deki yöndeşi de 80°'dir.;;PE bu açıyı iki eşit parçaya böler.;;x = 80° ÷ 2 = 40°", "f": "f172_3"}, {"n": 4, "t": "A, O ve B doğrusaldır. En büyük açının ölçüsü kaç derecedir?", "o": {"A": "72°", "B": "82°", "C": "92°", "D": "102°"}, "a": "A", "s": "Doğru üzerindeki açılar: 4x + 3x + 2x + x = 180°;;10x = 180° ⇒ x = 18°;;En büyük açı: 4x = 72°", "f": "f172_4"}, {"n": 5, "t": "Kesişen iki doğrunun oluşturduğu geniş açıların toplamı 250°'dir. x kaç derecedir?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "70°"}, "a": "A", "s": "İki geniş açı ters açılar olduğundan eşittir: a = 250° ÷ 2 = 125°.;;x, a'nın komşusudur: x = 180° – 125° = 55°", "f": "f173_1"}, {"n": 6, "t": "AB ve CD doğruları O'da kesişiyor ve OE ⊥ CD'dir. x'i bulunuz.", "o": {"A": "20", "B": "24", "C": "28", "D": "32"}, "a": "C", "s": "OE ⊥ CD olduğundan m(∠EOD) = 90°'dir.;;(2x – 6°) + (x + 12°) = 90°;;3x + 6° = 90° ⇒ x = 28", "f": "f173_2"}, {"n": 7, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "30", "B": "40", "C": "50", "D": "60"}, "a": "B", "s": "İşaretli açılar yöndeş açılar olduğundan eşittir.;;2x + 30° = 110°;;2x = 80° ⇒ x = 40", "f": "f173_3"}, {"n": 8, "t": "O noktası etrafındaki açıları kullanarak x'i bulunuz.", "o": {"A": "10", "B": "20", "C": "30", "D": "40"}, "a": "D", "s": "Biri dik açı olan, bir nokta etrafındaki açılar:;;90° + (x + 20°) + 2x + (3x + 10°) = 360°;;6x + 120° = 360° ⇒ x = 40", "f": "f173_4"}], "ch": 6}, {"n": 11, "title": "‘Karma Test 5’", "qs": [{"n": 1, "t": "A, O ve B doğrusaldır; [OD ve [OE ışınları ∠BOC ile ∠COA'nın açıortaylarıdır. m(∠BOC) kaçtır?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "70°"}, "a": "D", "s": "Komşu bütünler açıların açıortayları arasındaki açı 90°'dir.;;(2x + 5°) + (x + 10°) = 90° ⇒ 3x = 75° ⇒ x = 25;;m(∠DOC) = 35°, yani m(∠BOC) = 2 · 35° = 70°", "f": "f174_1"}, {"n": 2, "t": "O noktası etrafındaki açılar veriliyor. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "C", "s": "Biri dik açı olan, bir nokta etrafındaki açılar:;;100° + 90° + (2x + 20°) + 2x + x = 360°;;5x + 210° = 360° ⇒ x = 30", "f": "f174_2"}, {"n": 3, "t": "d₁ ∥ d₂'dir. y kaç derecedir?", "o": {"A": "110°", "B": "120°", "C": "130°", "D": "140°"}, "a": "B", "s": "İç ters açılar eşittir: 2x + 20° = 4x – 20° ⇒ x = 20;;Yani bu açı 60°'dir.;;y onunla bir doğru üzerindedir: y = 180° – 60° = 120°", "f": "f174_3"}, {"n": 4, "t": "Bir açının tümlerinin bütünlerine oranı <span class=\"fr\"><span>2</span><span>5</span></span>'dir. Açının ölçüsü kaç derecedir?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "A", "s": "[[90° – x;180° – x]] = [[2;5]];;5(90° – x) = 2(180° – x);;450° – 5x = 360° – 2x ⇒ 3x = 90° ⇒ x = 30°", "f": "f174_4"}, {"n": 5, "t": "AB ve CD doğruları O'da kesişiyor. [OE ışını ∠AOC'nin açıortayıdır. m(∠EOB) kaçtır?", "o": {"A": "128°", "B": "138°", "C": "148°", "D": "158°"}, "a": "B", "s": "Ters açılar: m(∠AOC) = m(∠BOD) = 84°.;;OE açıortaydır: m(∠AOE) = 84° ÷ 2 = 42°;;m(∠EOB) = 180° – 42° = 138°", "f": "f175_1"}, {"n": 6, "t": "OA ⊥ OD'dir. m(∠AOC) kaçtır?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "D", "s": "OA ⊥ OD: (3x – 10°) + 2x + (x + 10°) = 90°;;6x = 90° ⇒ x = 15;;m(∠AOC) = 2x + (x + 10°) = 30° + 25° = 55°", "f": "f175_2"}, {"n": 7, "t": "A, O ve B doğrusaldır ve OC ⊥ OD'dir. x kaçtır?", "o": {"A": "35°", "B": "45°", "C": "55°", "D": "65°"}, "a": "C", "s": "Doğru açı: 35° + 90° + x = 180°;;x = 180° – 125° = 55°", "f": "f175_3"}, {"n": 8, "t": "Üç doğru O noktasında kesişiyor. x'i bulunuz.", "o": {"A": "30", "B": "35", "C": "40", "D": "45"}, "a": "A", "s": "Doğrunun bir tarafındaki açıların toplamı 180°'dir.;;(x + 40°) + 50° + 2x = 180°;;3x + 90° = 180° ⇒ x = 30", "f": "f175_4"}], "ch": 6}, {"n": 12, "title": "‘Karma Test 6’", "qs": [{"n": 1, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "İşaretli açılar karşı durumlu açılar olduğundan bütünlerdir.;;5x + 4x = 180°;;9x = 180° ⇒ x = 20", "f": "f176_1"}, {"n": 2, "t": "Üç doğru O'da kesişiyor ve x = 2y'dir. x kaç derecedir?", "o": {"A": "80°", "B": "85°", "C": "90°", "D": "100°"}, "a": "A", "s": "Doğruların bir tarafındaki açıların toplamı 180°'dir: 60° + y + x = 180°.;;x = 2y: 60° + 3y = 180° ⇒ y = 40°;;x = 2 · 40° = 80°", "f": "f176_2"}, {"n": 3, "t": "[OC ışını ∠AOB'nin, [OD ışını da ∠COB'nin açıortayıdır. m(∠AOD) = 99° ise m(∠AOB) kaçtır?", "o": {"A": "112°", "B": "122°", "C": "132°", "D": "142°"}, "a": "C", "s": "m(∠AOC) = m(∠COB) ve OD, ∠COB'yi iki eşit parçaya böler.;;m(∠COD) = k olsun. O hâlde m(∠COB) = 2k ve m(∠AOC) = 2k.;;m(∠AOD) = 2k + k = 3k = 99° ⇒ k = 33°;;m(∠AOB) = 4k = 132°", "f": "f176_3"}, {"n": 4, "t": "Bir x açısının bütünlerinin yarısı ile tümlerinin toplamı 120°'dir. x kaç derecedir?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "D", "s": "[[180° – x;2]] + (90° – x) = 120°;;90° – [[x;2]] + 90° – x = 120°;;[[3x;2]] = 60° ⇒ x = 40°", "f": "f176_4"}, {"n": 5, "t": "d₁ ∥ d₂ ve [QR ışını işaretli açıyı iki eşit parçaya bölüyor. x kaç derecedir?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "55°"}, "a": "C", "s": "P'deki dar açı 180° – 110° = 70°'dir.;;Q'daki işaretli açı onun yöndeşidir: 70°.;;QR onu iki eşit parçaya böler: x = 70° ÷ 2 = 35°", "f": "f177_1"}, {"n": 6, "t": "O noktası etrafındaki açılar veriliyor. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "Biri dik açı olan, bir nokta etrafındaki açılar:;;90° + (2x + 10°) + 4x + (3x + 35°) = 360°;;9x + 135° = 360° ⇒ 9x = 225° ⇒ x = 25", "f": "f177_2"}, {"n": 7, "t": "d₁ ∥ d₂'dir. İşaretli açılardan büyük olanın ölçüsü kaç derecedir?", "o": {"A": "105°", "B": "115°", "C": "125°", "D": "135°"}, "a": "D", "s": "3x geniş, x dar açıdır; bu yüzden bütünlerdir.;;3x + x = 180° ⇒ x = 45°;;Büyük açı: 3x = 135°", "f": "f177_3"}, {"n": 8, "t": "AB ve CD doğruları O'da kesişiyor ve OE ⊥ AB'dir. x kaçtır?", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "B", "s": "OE ⊥ AB: m(∠AOC) = 90° – 35° = 55°.;;x ile ∠AOC ters açılardır.;;x = 55°", "f": "f177_4"}], "ch": 6}, {"n": 13, "title": "‘Zorlu Test 1’", "qs": [{"n": 1, "t": "AB ve CD doğruları O'da kesişiyor ve [OE ışını ∠BOD'nin açıortayıdır. m(∠AOE) kaçtır?", "o": {"A": "110°", "B": "120°", "C": "130°", "D": "140°"}, "a": "C", "s": "m(∠AOC) = 2x + 20°, yani m(∠AOD) = 180° – (2x + 20°) = 160° – 2x.;;Ters açılar: m(∠BOD) = 2x + 20°, yani m(∠DOE) = x + 10°.;;m(∠AOE) = (160° – 2x) + (x + 10°) = 3x + 10° ⇒ 170° – x = 3x + 10° ⇒ x = 40;;m(∠AOE) = 3 · 40° + 10° = 130°", "f": "f178_1"}, {"n": 2, "t": "Bir açının tümlerinin bütünlerine oranı 1 : 4'tür. Bu açının yarısının bütünleri kaç derecedir?", "o": {"A": "150°", "B": "140°", "C": "130°", "D": "120°"}, "a": "A", "s": "[[90° – x;180° – x]] = [[1;4]] ⇒ 4(90° – x) = 180° – x;;360° – 4x = 180° – x ⇒ 3x = 180° ⇒ x = 60°;;Açının yarısı: 30°. Bütünleri: 180° – 30° = 150°", "f": "f178_2"}, {"n": 3, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "65°", "B": "75°", "C": "85°", "D": "105°"}, "a": "B", "s": "Köşeden d₁ ve d₂'ye paralel bir doğru çiz.;;İç ters açılar: 40° ve 35°.;;x = 40° + 35° = 75°", "f": "f178_3"}, {"n": 4, "t": "d₁ ∥ d₂'dir. İşaretli iki iç açının açıortayları P noktasında kesişiyor. x kaçtır?", "o": {"A": "80°", "B": "85°", "C": "95°", "D": "90°"}, "a": "D", "s": "İşaretli iki iç açı karşı durumludur: toplamları 180°'dir.;;Yarılarının toplamı 90°'dir.;;APB üçgeni: x = 180° – 90° = 90°", "f": "f178_4"}, {"n": 5, "t": "AB ve CD doğruları O'da kesişiyor ve OE ⊥ AB'dir. m(∠AOD) kaçtır?", "o": {"A": "120°", "B": "110°", "C": "100°", "D": "130°"}, "a": "A", "s": "OE ⊥ AB: m(∠AOC) = 90° – 2x.;;Ters açılar: 90° – 2x = 3x + 15° ⇒ 5x = 75° ⇒ x = 15;;m(∠BOD) = 60°, yani m(∠AOD) = 180° – 60° = 120°", "f": "f179_1"}, {"n": 6, "t": "A, O ve B doğrusaldır ve OC ⊥ OD'dir. [OE ve [OF ışınları ∠AOC ile ∠DOB'nin açıortaylarıdır. x kaçtır?", "o": {"A": "120°", "B": "125°", "C": "135°", "D": "145°"}, "a": "C", "s": "Doğru açı: m(∠AOC) + m(∠DOB) = 180° – 90° = 90°;;Açıortaylar her birinin yarısını alır: 90° ÷ 2 = 45°;;x = 45° + 90° = 135°", "f": "f179_2"}, {"n": 7, "t": "d₁ ∥ d₂'dir. k ve m doğruları d₁ üzerindeki P noktasında kesişiyor. x kaçtır?", "o": {"A": "55°", "B": "60°", "C": "70°", "D": "65°"}, "a": "D", "s": "P'deki iç ters açılar: 65° ve 50°.;;P'deki doğru açı: 65° + x + 50° = 180°;;x = 65°", "f": "f179_3"}, {"n": 8, "t": "Üç doğru O noktasında kesişiyor. Şekildeki en büyük açının ölçüsü kaç derecedir?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "Doğruların bir tarafındaki açıların toplamı 180°'dir.;;2x + (x + 20°) + (3x – 20°) = 180° ⇒ 6x = 180° ⇒ x = 30;;Açılar 60°, 50° ve 70°'dir. En büyük: 70°", "f": "f179_4"}], "ch": 6}, {"n": 14, "title": "‘Zorlu Test 2’", "qs": [{"n": 1, "t": "d₁ ∥ d₂'dir. x'i bulunuz.", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "85°"}, "a": "C", "s": "İki köşeden d₁ ve d₂'ye paralel doğrular çiz.;;Sağa açılan açıların toplamı sola açılan açıların toplamına eşittir:;;30° + 70° = x + 25°;;x = 75°", "f": "f180_1"}, {"n": 2, "t": "A, O ve C doğrusaldır. [OD ışını ∠AOB'nin, [OE ışını da ∠BOC'nin açıortayıdır. m(∠BOE) kaçtır?", "o": {"A": "48°", "B": "42°", "C": "46°", "D": "52°"}, "a": "A", "s": "OD ve OE açıortaydır: m(∠AOB) = 2(2x + 10°) ve m(∠BOC) = 2 · 3x.;;Doğru açı: 4x + 20° + 6x = 180° ⇒ 10x = 160° ⇒ x = 16;;m(∠BOE) = 3x = 48°", "f": "f180_2"}, {"n": 3, "t": "d₁ ∥ d₂ ve k ∥ m'dir. x'i bulunuz.", "o": {"A": "15", "B": "20", "C": "25", "D": "30"}, "a": "B", "s": "d₁ ∥ d₂ ve k ∥ m olduğundan işaretli iki açı eşittir.;;3x + 15° = 5x – 25°;;40° = 2x ⇒ x = 20", "f": "f180_3"}, {"n": 4, "t": "[OB ışını ∠AOC'nin açıortayıdır. m(∠COD) kaçtır?", "o": {"A": "100°", "B": "110°", "C": "130°", "D": "120°"}, "a": "D", "s": "OB açıortaydır: m(∠AOB) = m(∠BOC) = x + 25°.;;O etrafında: 2(x + 25°) + 3x + (2x + 30°) = 360°;;7x + 80° = 360° ⇒ x = 40;;m(∠COD) = 3x = 120°", "f": "f180_4"}, {"n": 5, "t": "AB ve CD doğruları O'da kesişiyor. [OE ve [OF ışınları ∠AOC ile ∠BOC'nin açıortaylarıdır. m(∠BOD) kaçtır?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "110°"}, "a": "B", "s": "m(∠AOC) = 2(2x + 5°) ve m(∠COB) = 2(3x + 10°).;;Doğru açı: 4x + 10° + 6x + 20° = 180° ⇒ x = 15;;m(∠AOC) = 70°. ∠BOD ile ∠AOC ters açılardır: m(∠BOD) = 70°", "f": "f181_1"}, {"n": 6, "t": "Bir açının tümlerinin bütünleri, açının 4 katıdır. Bu açının 2 katının bütünleri kaç derecedir?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "C", "s": "Tümleri: 90° – x. Onun bütünleri: 180° – (90° – x) = 90° + x.;;90° + x = 4x ⇒ 3x = 90° ⇒ x = 30°;;Açının 2 katı: 60°. Bütünleri: 180° – 60° = 120°", "f": "f181_2"}, {"n": 7, "t": "d₁ ∥ d₂'dir. A'dan çıkan ışın işaretli 110°'lik açıyı iki eşit parçaya bölüyor ve d₂'yi C'de kesiyor. x kaçtır?", "o": {"A": "55°", "B": "45°", "C": "65°", "D": "70°"}, "a": "A", "s": "Işın 110°'yi iki eşit parçaya böler: 55° ve 55°.;;x ile 55° iç ters açılardır.;;x = 55°", "f": "f181_3"}, {"n": 8, "t": "d₁ ∥ d₂ ∥ d₃'tür. y kaç derecedir?", "o": {"A": "70°", "B": "100°", "C": "120°", "D": "110°"}, "a": "D", "s": "d₁ ve d₃'teki işaretli açıların ikisi de dar açı olduğundan eşittir.;;3x + 10° = 5x – 30° ⇒ x = 20 ⇒ dar açı 70°'dir.;;y geniş açıdır: y = 180° – 70° = 110°", "f": "f181_4"}], "ch": 6}], "7": [{"n": 1, "title": "‘Üçgenin İç Açıları’", "qs": [{"n": 1, "t": "ABC üçgeninde m(∠B) = 48° ve m(∠C) = 57°'dir. x kaç derecedir?", "o": {"A": "75°", "B": "80°", "C": "85°", "D": "95°"}, "a": "A", "s": "Bir üçgenin iç açılarının toplamı 180°'dir.;;x + 48° + 57° = 180°;;x = 180° – 105° = 75°", "f": "f200_1"}, {"n": 2, "t": "ABC üçgeninde x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "C", "s": "(2x + 20°) + (x + 15°) + (3x – 35°) = 180°;;6x = 180°;;x = 30", "f": "f200_2"}, {"n": 3, "t": "ABC üçgeninde m(∠A) = 2 · m(∠B) ve m(∠C) = 60°'dir. m(∠A) kaçtır?", "o": {"A": "60°", "B": "70°", "C": "75°", "D": "80°"}, "a": "D", "s": "m(∠B) = a ve m(∠A) = 2a.;;2a + a + 60° = 180° ⇒ 3a = 120° ⇒ a = 40°;;m(∠A) = 2a = 80°", "f": "f200_3"}, {"n": 4, "t": "Bir üçgenin iç açıları 2, 3 ve 7 ile orantılıdır. En büyük açının ölçüsü kaç derecedir?", "o": {"A": "95°", "B": "105°", "C": "115°", "D": "125°"}, "a": "B", "s": "2k + 3k + 7k = 180° ⇒ 12k = 180° ⇒ k = 15°;;En büyük açı: 7k = 105°", "f": "f200_4"}, {"n": 5, "t": "ABC üçgeninde D ∈ [BC]'dir. Şekle göre m(∠ACB) kaçtır?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "C", "s": "m(∠BAC) = 30° + 40° = 70°;;m(∠ACB) = 180° – 50° – 70° = 60°", "f": "f201_1"}, {"n": 6, "t": "ABC üçgeninde m(∠A) – m(∠B) = 20° ve m(∠C) = 70°'dir. m(∠A) kaçtır?", "o": {"A": "65°", "B": "70°", "C": "75°", "D": "80°"}, "a": "A", "s": "a + b = 180° – 70° = 110° ve a – b = 20°.;;2a = 130° ⇒ a = 65°", "f": "f201_2"}, {"n": 7, "t": "ABC üçgeninde x'i bulunuz.", "o": {"A": "55°", "B": "65°", "C": "75°", "D": "85°"}, "a": "A", "s": "x + 50° + 75° = 180°;;x = 180° – 125° = 55°", "f": "f201_3"}, {"n": 8, "t": "ABC üçgeninin en büyük açısının ölçüsü kaç derecedir?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "C", "s": "(3x – 10°) + 2x + (x + 10°) = 180° ⇒ 6x = 180° ⇒ x = 30;;Açılar 80°, 60° ve 40°'dir. En büyük: 80°", "f": "f201_4"}], "ch": 7}, {"n": 2, "title": "‘Üçgenin Dış Açısı’", "qs": [{"n": 1, "t": "B, C ve D doğrusaldır. x kaç derecedir?", "o": {"A": "85°", "B": "95°", "C": "105°", "D": "115°"}, "a": "D", "s": "Bir dış açı, kendisine komşu olmayan iki iç açının toplamına eşittir.;;x = 48° + 67° = 115°", "f": "f202_1"}, {"n": 2, "t": "B, C ve D doğrusaldır. x kaç derecedir?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "B", "s": "Dış açı: 125° = 70° + x;;x = 55°", "f": "f202_2"}, {"n": 3, "t": "B, C ve D doğrusaldır. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "A", "s": "Dış açı: 4x = (x + 30°) + (2x – 10°);;4x = 3x + 20°;;x = 20", "f": "f202_3"}, {"n": 4, "t": "D, B ve C doğrusaldır. x kaç derecedir?", "o": {"A": "95°", "B": "105°", "C": "115°", "D": "125°"}, "a": "C", "s": "x, B'deki dış açıdır.;;x = 40° + 75° = 115°", "f": "f202_4"}, {"n": 5, "t": "B, C ve D doğrusaldır ve m(∠ACD) = 2 · m(∠BAC)'dir. x kaç derecedir?", "o": {"A": "35°", "B": "40°", "C": "45°", "D": "50°"}, "a": "D", "s": "Dış açı: 2x = x + 50°;;x = 50°", "f": "f203_1"}, {"n": 6, "t": "E, B, C ve D doğrusaldır. Dış açılara göre x kaç derecedir?", "o": {"A": "60°", "B": "65°", "C": "70°", "D": "75°"}, "a": "B", "s": "B'deki iç açı: 180° – 130° = 50°.;;C'deki iç açı: 180° – 115° = 65°.;;x = 180° – 50° – 65° = 65°", "f": "f203_2"}, {"n": 7, "t": "B, C ve D doğrusaldır. x kaç derecedir?", "o": {"A": "55°", "B": "65°", "C": "75°", "D": "85°"}, "a": "B", "s": "Dış açı: 110° = 45° + x;;x = 65°", "f": "f203_3"}, {"n": 8, "t": "B, C ve D doğrusaldır. x'i bulunuz.", "o": {"A": "20", "B": "30", "C": "40", "D": "50"}, "a": "D", "s": "Dış açı: 3x = (x + 20°) + (x + 30°);;3x = 2x + 50°;;x = 50", "f": "f203_4"}], "ch": 7}, {"n": 3, "title": "‘Dış Açıların Toplamı’", "qs": [{"n": 1, "t": "ABC üçgeninin dış açıları veriliyor. x kaç derecedir?", "o": {"A": "110°", "B": "120°", "C": "130°", "D": "140°"}, "a": "C", "s": "Dış açıların toplamı 360°'dir.;;125° + 105° + x = 360°;;x = 130°", "f": "f204_1"}, {"n": 2, "t": "Şekildeki dış açıları kullanarak x'i bulunuz.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "A", "s": "(2x + 20°) + 3x + (4x – 20°) = 360°;;9x = 360°;;x = 40", "f": "f204_2"}, {"n": 3, "t": "Bir üçgenin dış açıları 3, 4 ve 5 ile orantılıdır. Bu üçgenin en küçük iç açısı kaç derecedir?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "90°"}, "a": "B", "s": "3k + 4k + 5k = 360° ⇒ 12k = 360° ⇒ k = 30°;;En büyük dış açı 5k = 150°'dir.;;En küçük iç açı onun komşusudur: 180° – 150° = 30°", "f": "f204_3"}, {"n": 4, "t": "A ve B'deki dış açılar 120° ve 140°'dir. m(∠C) kaçtır?", "o": {"A": "60°", "B": "70°", "C": "75°", "D": "80°"}, "a": "D", "s": "C'deki dış açı: 360° – 120° – 140° = 100°.;;m(∠C) = 180° – 100° = 80°", "f": "f204_4"}, {"n": 5, "t": "A ve B'deki dış açılar eşittir. C'deki dış açı 100° ise x kaç derecedir?", "o": {"A": "130°", "B": "140°", "C": "150°", "D": "160°"}, "a": "A", "s": "A ve B'deki dış açıların ikisi de x'tir.;;x + x + 100° = 360° ⇒ 2x = 260°;;x = 130°", "f": "f205_1"}, {"n": 6, "t": "Şekilde m(∠A) = x'tir. Verilen açıları kullanarak x'in kaç derece olduğunu bulunuz.", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "A'daki dış açı: 180° – x.;;(180° – x) + 120° + (2x + 30°) = 360°;;x + 330° = 360° ⇒ x = 30°", "f": "f205_2"}, {"n": 7, "t": "ABC üçgeninin dış açıları veriliyor. x'i bulunuz.", "o": {"A": "20", "B": "30", "C": "40", "D": "50"}, "a": "C", "s": "3x + 2x + 4x = 360°;;9x = 360°;;x = 40", "f": "f205_3"}, {"n": 8, "t": "A ve B'deki dış açılar 130° ve 110°'dir. m(∠C) kaçtır?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "A", "s": "C'deki dış açı: 360° – 130° – 110° = 120°.;;m(∠C) = 180° – 120° = 60°", "f": "f205_4"}], "ch": 7}, {"n": 4, "title": "‘Dik Üçgende Açılar’", "qs": [{"n": 1, "t": "ABC üçgeninde m(∠C) = 90° ve m(∠A) = 58°'dir. x kaç derecedir?", "o": {"A": "28°", "B": "32°", "C": "36°", "D": "40°"}, "a": "B", "s": "Bir dik üçgenin dar açıları tümlerdir.;;x + 58° = 90°;;x = 32°", "f": "f206_1"}, {"n": 2, "t": "AB ⊥ BC'dir. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "AB ⊥ BC olduğundan dar açıların toplamı 90°'dir.;;(x + 30°) + 2x = 90°;;3x = 60° ⇒ x = 20", "f": "f206_2"}, {"n": 3, "t": "Bir dik üçgenin dar açıları arasındaki fark 30°'dir. Büyük dar açı kaç derecedir?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "65°"}, "a": "C", "s": "a + b = 90° ve a – b = 30°.;;2a = 120° ⇒ a = 60°", "f": "f206_3"}, {"n": 4, "t": "m(∠BAC) = 90°, AD ⊥ BC ve m(∠BAD) = 52°'dir. x kaç derecedir?", "o": {"A": "38°", "B": "42°", "C": "46°", "D": "52°"}, "a": "A", "s": "ABD üçgeni bir dik üçgendir (AD ⊥ BC).;;x + 52° = 90°;;x = 38°", "f": "f206_4"}, {"n": 5, "t": "m(∠C) = 90° ve D, B, C doğrusaldır. x kaç derecedir?", "o": {"A": "35°", "B": "40°", "C": "45°", "D": "50°"}, "a": "B", "s": "m(∠ABC) = 180° – 130° = 50°.;;Dik üçgen: x + 50° = 90°;;x = 40°", "f": "f207_1"}, {"n": 6, "t": "AB ⊥ BC, D ∈ [BC] ve m(∠BAD) = 25°'dir. x kaç derecedir?", "o": {"A": "85°", "B": "95°", "C": "105°", "D": "115°"}, "a": "D", "s": "ABD üçgeni: m(∠ADB) = 90° – 25° = 65°.;;x ile ∠ADB bir doğru üzerindedir.;;x = 180° – 65° = 115°", "f": "f207_2"}, {"n": 7, "t": "m(∠BAC) = 90°'dir. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "m(∠BAC) = 90° olduğundan diğer iki açının toplamı 90°'dir.;;(2x + 5°) + (x + 25°) = 90°;;3x = 60° ⇒ x = 20", "f": "f207_3"}, {"n": 8, "t": "m(∠C) = 90° ve E, B, C doğrusaldır. m(∠A) kaçtır?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "70°"}, "a": "B", "s": "m(∠ABC) = 180° – 140° = 40°.;;m(∠A) = 90° – 40° = 50°", "f": "f207_4"}], "ch": 7}, {"n": 5, "title": "‘İkizkenar Üçgende Açılar’", "qs": [{"n": 1, "t": "|AB| = |AC| ve m(∠A) = 36°'dir. x kaç derecedir?", "o": {"A": "72°", "B": "82°", "C": "92°", "D": "144°"}, "a": "A", "s": "|AB| = |AC| olduğundan taban açıları eşittir: m(∠B) = m(∠C) = x.;;36° + 2x = 180° ⇒ 2x = 144°;;x = 72°", "f": "f208_1"}, {"n": 2, "t": "|AB| = |AC| ve m(∠C) = 70°'dir. x kaç derecedir?", "o": {"A": "35°", "B": "40°", "C": "45°", "D": "50°"}, "a": "B", "s": "Taban açıları eşittir: m(∠B) = m(∠C) = 70°.;;x = 180° – 70° – 70° = 40°", "f": "f208_2"}, {"n": 3, "t": "|AB| = |AC|'dir. x'i bulunuz.", "o": {"A": "24", "B": "28", "C": "32", "D": "36"}, "a": "D", "s": "Taban açılarının ikisi de 2x – 10°'dir.;;(x + 20°) + 2(2x – 10°) = 180°;;5x = 180° ⇒ x = 36", "f": "f208_3"}, {"n": 4, "t": "|BA| = |BC| ve m(∠B) = 50°'dir. x kaç derecedir?", "o": {"A": "55°", "B": "60°", "C": "65°", "D": "70°"}, "a": "C", "s": "|BA| = |BC| olduğundan m(∠A) = m(∠C) = x.;;50° + 2x = 180° ⇒ 2x = 130°;;x = 65°", "f": "f208_4"}, {"n": 5, "t": "|AB| = |AC| ve D, B, C doğrusaldır. x kaç derecedir?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "D", "s": "m(∠ABC) = 180° – 110° = 70° = m(∠C).;;x = 180° – 70° – 70° = 40°", "f": "f209_1"}, {"n": 6, "t": "|AB| = |AC| ve B, A, E doğrusaldır. x kaç derecedir?", "o": {"A": "50°", "B": "55°", "C": "60°", "D": "80°"}, "a": "A", "s": "100°, A'daki dış açıdır: 100° = m(∠B) + m(∠C).;;Taban açıları eşittir: 2x = 100°;;x = 50°", "f": "f209_2"}, {"n": 7, "t": "|AB| = |AC|'dir. x'i bulunuz.", "o": {"A": "30", "B": "35", "C": "40", "D": "45"}, "a": "A", "s": "Taban açılarının ikisi de 2x + 10°'dir.;;40° + 2(2x + 10°) = 180°;;4x + 60° = 180° ⇒ x = 30", "f": "f209_3"}, {"n": 8, "t": "|AB| = |AC|'dir. x kaç derecedir?", "o": {"A": "30°", "B": "40°", "C": "50°", "D": "60°"}, "a": "C", "s": "100°, A'daki dış açıdır: m(∠B) + m(∠C) = 100°.;;Taban açıları eşittir: 2x = 100°;;x = 50°", "f": "f209_4"}], "ch": 7}, {"n": 6, "title": "‘Eşkenar Üçgende Açılar’", "qs": [{"n": 1, "t": "ABC bir eşkenar üçgendir. x'i bulunuz.", "o": {"A": "10", "B": "15", "C": "20", "D": "25"}, "a": "C", "s": "Eşkenar üçgenin her iç açısı 60°'dir.;;4x – 20° = 60°;;4x = 80° ⇒ x = 20", "f": "f210_1"}, {"n": 2, "t": "ABC bir eşkenar üçgendir ve D ∈ [BC]'dir. x kaç derecedir?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "D", "s": "m(∠ADC) = 95°, ABD üçgeninin bir dış açısıdır.;;95° = m(∠B) + x = 60° + x;;x = 35°", "f": "f210_2"}, {"n": 3, "t": "ABC bir eşkenar üçgendir. B ve C köşelerindeki dış açıların toplamı kaç derecedir?", "o": {"A": "240°", "B": "250°", "C": "260°", "D": "270°"}, "a": "A", "s": "Eşkenar üçgenin her dış açısı 180° – 60° = 120°'dir.;;x + y = 120° + 120° = 240°", "f": "f210_3"}, {"n": 4, "t": "ABC bir eşkenar üçgen, D ∈ [AC] ve m(∠ABD) = 25°'dir. x kaç derecedir?", "o": {"A": "80°", "B": "85°", "C": "90°", "D": "105°"}, "a": "B", "s": "x, ABD üçgeninin bir dış açısıdır.;;x = m(∠A) + m(∠ABD) = 60° + 25°;;x = 85°", "f": "f210_4"}, {"n": 5, "t": "ABC bir eşkenar üçgen, B, C, D doğrusal ve |CD| = |CA|'dır. m(∠BAD) kaçtır?", "o": {"A": "90°", "B": "95°", "C": "100°", "D": "105°"}, "a": "A", "s": "m(∠ACD) = 180° – 60° = 120°.;;|CD| = |CA|: ACD üçgeni ikizkenardır, m(∠CAD) = (180° – 120°) ÷ 2 = 30°.;;m(∠BAD) = 60° + 30° = 90°", "f": "f211_1"}, {"n": 6, "t": "ABC bir eşkenar üçgendir ve AD ⊥ BC'dir. x kaç derecedir?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "60°"}, "a": "C", , "C": "40°", "D": "45°"}, "a": "A", "s": "ABD üçgeni: m(∠B) = 90° – 30° = 60°.;;ABC üçgeni: x = 90° – 60°;;x = 30°", "f": "f217_3"}, {"n": 8, "t": "ABC üçgeninin dış açıları veriliyor. En büyük dış açının ölçüsü kaç derecedir?", "o": {"A": "140°", "B": "150°", "C": "160°", "D": "170°"}, "a": "C", "s": "(x + 20°) + 2x + (3x – 20°) = 360° ⇒ 6x = 360° ⇒ x = 60;;Dış açılar 80°, 120° ve 160°'dir. En büyük: 160°", "f": "f217_4"}], "ch": 7}, {"n": 10, "title": "‘Karma Test 4’", "qs": [{"n": 1, "t": "D ∈ [BC]'dir. x kaç derecedir?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "C", "s": "x, ABD üçgeninin bir dış açısıdır.;;x = 45° + 35°;;x = 80°", "f": "f218_1"}, {"n": 2, "t": "ABC üçgeninde m(∠A) = 105° ve m(∠B) = 2 · m(∠C)'dir. m(∠B) kaçtır?", "o": {"A": "45°", "B": "50°", "C": "55°", "D": "60°"}, "a": "B", "s": "m(∠C) = c ve m(∠B) = 2c.;;105° + 2c + c = 180° ⇒ 3c = 75° ⇒ c = 25°;;m(∠B) = 50°", "f": "f218_2"}, {"n": 3, "t": "AB ⊥ BC'dir. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "C", "s": "AB ⊥ BC olduğundan dar açılar tümlerdir.;;(4x – 10°) + (2x + 10°) = 90°;;6x = 90° ⇒ x = 15", "f": "f218_3"}, {"n": 4, "t": "A'daki dış açı 110°'dir. B'deki dış açı, C'deki dış açıdan 30° büyüktür. x kaç derecedir?", "o": {"A": "140°", "B": "150°", "C": "160°", "D": "170°"}, "a": "A", "s": "B ve C'deki dış açıların toplamı 360° – 110° = 250°'dir.;;C'deki dış açı y olsun: y + (y + 30°) = 250° ⇒ y = 110°;;x = 110° + 30° = 140°", "f": "f218_4"}, {"n": 5, "t": "|AB| = |AC|'dir. x'i bulunuz.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "A", "s": "Taban açılarının ikisi de x + 30°'dir.;;x + 2(x + 30°) = 180°;;3x = 120° ⇒ x = 40", "f": "f219_1"}, {"n": 6, "t": "ABC bir eşkenar üçgen, D ∈ [BC] ve m(∠ADB) = 100°'dir. x kaç derecedir?", "o": {"A": "30°", "B": "35°", "C": "40°", "D": "45°"}, "a": "C", "s": "m(∠ADC) = 180° – 100° = 80°.;;ADC üçgeni: x = 180° – 80° – 60°;;x = 40°", "f": "f219_2"}, {"n": 7, "t": "|AB| = |AC| ve B, C, D doğrusaldır. x kaçtır?", "o": {"A": "40°", "B": "50°", "C": "60°", "D": "70°"}, "a": "B", "s": "m(∠ACB) = 180° – 115° = 65° = m(∠B).;;x = 180° – 65° – 65°;;x = 50°", "f": "f219_3"}, {"n": 8, "t": "ABC üçgeninin en büyük açısının ölçüsü kaç derecedir?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "D", "s": "x + 2x + 3x = 180° ⇒ 6x = 180° ⇒ x = 30°;;En büyük açı: 3x = 90°", "f": "f219_4"}], "ch": 7}, {"n": 11, "title": "‘Karma Test 5’", "qs": [{"n": 1, "t": "ABC üçgeninde m(∠A) = m(∠B) + m(∠C) ve m(∠B) = 35°'dir. x kaç derecedir?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "D", "s": "m(∠A) + m(∠B) + m(∠C) = 180° ve m(∠A) = m(∠B) + m(∠C).;;2 · m(∠A) = 180° ⇒ m(∠A) = 90°;;x = 90° – 35° = 55°", "f": "f220_1"}, {"n": 2, "t": "B, C ve D doğrusaldır. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "C", "s": "C'deki dış açı: 4x + 20° = (2x + 20°) + (x + 30°);;4x + 20° = 3x + 50°;;x = 30", "f": "f220_2"}, {"n": 3, "t": "m(∠BAC) = 90° ve AD ⊥ BC'dir. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "ADC üçgeni: m(∠DAC) = 90° – 60° = 30°.;;m(∠BAD) = 90° – 30° = 60°;;2x + 10° = 60° ⇒ x = 25", "f": "f220_3"}, {"n": 4, "t": "|CA| = |CB| ve m(∠C) = 40°'dir. x kaç derecedir?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "A", "s": "|CA| = |CB| olduğundan m(∠A) = m(∠B) = x.;;x + x + 40° = 180°;;x = 70°", "f": "f220_4"}, {"n": 5, "t": "Şekildeki dış açıları kullanarak x'i bulunuz.", "o": {"A": "40", "B": "45", "C": "50", "D": "55"}, "a": "B", "s": "Dış açıların toplamı 360°'dir.;;(x + 40°) + (2x + 30°) + (3x + 20°) = 360°;;6x + 90° = 360° ⇒ x = 45", "f": "f221_1"}, {"n": 6, "t": "ABC bir eşkenar üçgen, D ∈ [BC] ve m(∠BAD) = x + 5°'dir. x'i bulunuz.", "o": {"A": "5", "B": "10", "C": "15", "D": "20"}, "a": "D", "s": "3x + 25°, ABD üçgeninin bir dış açısıdır.;;3x + 25° = 60° + (x + 5°);;2x = 40° ⇒ x = 20", "f": "f221_2"}, {"n": 7, "t": "ABC bir eşkenar üçgendir ve BD ⊥ AC'dir. x kaçtır?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "Eşkenar üçgende BD yüksekliği aynı zamanda ∠B'nin açıortayıdır.;;x = 60° ÷ 2 = 30°", "f": "f221_3"}, {"n": 8, "t": "m(∠C) = 90°'dir. A'daki dış açıyı kullanarak x'i bulunuz.", "o": {"A": "45°", "B": "55°", "C": "65°", "D": "75°"}, "a": "A", "s": "A'daki dış açı: 3x = m(∠B) + m(∠C) = x + 90°.;;2x = 90°;;x = 45°", "f": "f221_4"}], "ch": 7}, {"n": 12, "title": "‘Karma Test 6’", "qs": [{"n": 1, "t": "Bir üçgenin iç açıları 2, 3 ve 4 ile orantılıdır. Üçgenin en küçük açısı kaç derecedir?", "o": {"A": "20°", "B": "40°", "C": "45°", "D": "60°"}, "a": "B", "s": "2k + 3k + 4k = 180° ⇒ 9k = 180° ⇒ k = 20°;;En küçük açı: 2k = 40°", "f": "f222_1"}, {"n": 2, "t": "E, B, C ve D doğrusaldır. Dış açılara göre x kaç derecedir?", "o": {"A": "70°", "B": "75°", "C": "80°", "D": "85°"}, "a": "A", "s": "m(∠B) = 180° – 120° = 60° ve m(∠C) = 180° – 130° = 50°.;;x = 180° – 60° – 50°;;x = 70°", "f": "f222_2"}, {"n": 3, "t": "AB ⊥ BC ve B, C, D doğrusaldır. x kaç derecedir?", "o": {"A": "40°", "B": "45°", "C": "50°", "D": "55°"}, "a": "C", "s": "m(∠ACB) = 180° – 140° = 40°.;;Dik üçgen: x + 40° = 90°;;x = 50°", "f": "f222_3"}, {"n": 4, "t": "|AB| = |AC| ve B, A, E doğrusaldır. x'i bulunuz.", "o": {"A": "25", "B": "30", "C": "35", "D": "40"}, "a": "D", "s": "Taban açılarının ikisi de x + 10°'dir.;;A'daki dış açı: 3x – 20° = 2(x + 10°);;3x – 20° = 2x + 20° ⇒ x = 40", "f": "f222_4"}, {"n": 5, "t": "m(∠A) = 90°'dir. Dış açıları kullanarak x'i bulunuz.", "o": {"A": "34", "B": "44", "C": "54", "D": "64"}, "a": "C", "s": "A'daki dış açı 180° – 90° = 90°'dir.;;90° + 2x + 3x = 360°;;5x = 270° ⇒ x = 54", "f": "f223_1"}, {"n": 6, "t": "ABC bir eşkenar üçgendir ve BD, ∠ABC'nin açıortayıdır. m(∠BDC) kaçtır?", "o": {"A": "60°", "B": "90°", "C": "95°", "D": "120°"}, "a": "B", "s": "m(∠ABD) = m(∠DBC) = 30° ve m(∠C) = 60°.;;BDC üçgeni: m(∠BDC) = 180° – 30° – 60°;;m(∠BDC) = 90°", "f": "f223_2"}, {"n": 7, "t": "|AB| = |AC|'dir. m(∠BAC) kaçtır?", "o": {"A": "20°", "B": "30°", "C": "40°", "D": "50°"}, "a": "D", "s": "Taban açılarının ikisi de x + 40°'dir.;;2x + 2(x + 40°) = 180° ⇒ 4x = 100° ⇒ x = 25;;m(∠BAC) = 2x = 50°", "f": "f223_3"}, {"n": 8, "t": "D ∈ [BC] ve |AD| = |BD|'dir. x kaçtır?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "|AD| = |BD|: ABD üçgeni ikizkenardır, m(∠BAD) = m(∠B) = 35°.;;x, ABD üçgeninin bir dış açısıdır.;;x = 35° + 35° = 70°", "f": "f223_4"}], "ch": 7}, {"n": 13, "title": "‘Zorlu Test 1’", "qs": [{"n": 1, "t": "|AB| = |AC|, B, C, D doğrusal ve BE, ∠ABC'nin açıortayıdır. x kaçtır?", "o": {"A": "95°", "B": "100°", "C": "105°", "D": "110°"}, "a": "C", "s": "m(∠ACB) = 180° – 110° = 70° = m(∠ABC), yani m(∠A) = 40°.;;BE açıortaydır: m(∠ABE) = 35°.;;ABE üçgeni: x = 180° – 40° – 35° = 105°", "f": "f224_1"}, {"n": 2, "t": "m(∠BAC) = 90°, AD ⊥ BC ve AE, ∠DAC'nin açıortayıdır. x kaçtır?", "o": {"A": "65°", "B": "55°", "C": "60°", "D": "70°"}, "a": "A", "s": "m(∠BAC) = 90° ve AD ⊥ BC olduğundan m(∠DAC) = m(∠B) = 50°'dir.;;AE açıortaydır: m(∠DAE) = 25°.;;ADE üçgeni: x = 90° – 25° = 65°", "f": "f224_2"}, {"n": 3, "t": "|AB| = |AC|'dir. Dış açıları kullanarak m(∠BAC)'yi bulunuz.", "o": {"A": "48°", "B": "52°", "C": "56°", "D": "64°"}, "a": "B", "s": "m(∠B) = m(∠C) = b olsun. A'daki dış açı 2b = 4x, yani b = 2x.;;B'deki dış açı: 3x + 20° = 180° – 2x ⇒ 5x = 160° ⇒ x = 32;;b = 64°, yani m(∠BAC) = 180° – 128° = 52°", "f": "f224_3"}, {"n": 4, "t": "ABC üçgeninde ∠B ve ∠C'nin açıortayları I'da kesişiyor. x kaçtır?", "o": {"A": "115°", "B": "120°", "C": "135°", "D": "125°"}, "a": "D", "s": "m(∠B) + m(∠C) = 180° – 70° = 110°.;;Yarılarının toplamı 55°'dir.;;BIC üçgeni: x = 180° – 55° = 125°", "f": "f224_4"}, {"n": 5, "t": "ABC bir eşkenar üçgen, |CD| = |CA| ve m(∠ACD) = 90°'dir. x kaçtır?", "o": {"A": "95°", "B": "100°", "C": "105°", "D": "115°"}, "a": "C", "s": "m(∠ACD) = 90° ve |CD| = |CA|: m(∠CAD) = 45°.;;x = m(∠BAC) + m(∠CAD) = 60° + 45°;;x = 105°", "f": "f225_1"}, {"n": 6, "t": "D ∈ [BC] ve |AD| = |DC|'dir. x kaçtır?", "o": {"A": "55°", "B": "45°", "C": "50°", "D": "60°"}, "a": "A", "s": "ABD üçgeni: m(∠ADB) = 180° – 40° – 30° = 110°, yani m(∠ADC) = 70°.;;|AD| = |DC|: ADC üçgeni ikizkenardır, m(∠DAC) = m(∠C) = x.;;2x + 70° = 180° ⇒ x = 55°", "f": "f225_2"}, {"n": 7, "t": "m(∠C) = 90°'dir. A'daki dış açı m(∠B)'nin 4 katıdır. x kaçtır?", "o": {"A": "25°", "B": "30°", "C": "35°", "D": "40°"}, "a": "B", "s": "A'daki dış açı: 4x = m(∠B) + m(∠C) = x + 90°.;;3x = 90°;;x = 30°", "f": "f225_3"}, {"n": 8, "t": "D ∈ [AB], |AD| = |DC| ve |CD| = |CB|'dir. m(∠ACB) kaçtır?", "o": {"A": "65°", "B": "70°", "C": "80°", "D": "75°"}, "a": "D", "s": "|AD| = |DC|: m(∠DCA) = m(∠A) = 35°, yani m(∠CDB) = 70°.;;|CD| = |CB|: m(∠B) = 70°, yani m(∠DCB) = 180° – 140° = 40°.;;m(∠ACB) = 35° + 40° = 75°", "f": "f225_4"}], "ch": 7}, {"n": 14, "title": "‘Zorlu Test 2’", "qs": [{"n": 1, "t": "B, C, D doğrusaldır. ABC üçgeninin en büyük iç açısının ölçüsü kaç derecedir?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "90°"}, "a": "B", "s": "Dış açı: 4x – 10° = 2x + (x + 20°) ⇒ x = 30;;m(∠A) = 60°, m(∠B) = 50°, m(∠C) = 180° – 110° = 70°.;;En büyük açı: 70°", "f": "f226_1"}, {"n": 2, "t": "|AB| = |AC|, AH ⊥ BC ve E, B, C doğrusaldır. x kaçtır?", "o": {"A": "115°", "B": "105°", "C": "125°", "D": "130°"}, "a": "A", "s": "|AB| = |AC| ve AH ⊥ BC: ABH üçgeninde m(∠BAH) = 25°'dir.;;m(∠ABH) = 90° – 25° = 65°;;x = 180° – 65° = 115°", "f": "f226_2"}, {"n": 3, "t": "ABC bir eşkenar üçgen, BD, ∠ABC'nin açıortayı ve DE ∥ BC'dir. x kaçtır?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "35°"}, "a": "C", "s": "BD açıortaydır: m(∠DBC) = 30°.;;DE ∥ BC: x ile ∠DBC iç ters açılardır.;;x = 30°", "f": "f226_3"}, {"n": 4, "t": "m(∠ABC) = 90° ve DE ∥ BC'dir. m(∠ACB) kaçtır?", "o": {"A": "40°", "B": "45°", "C": "55°", "D": "50°"}, "a": "D", "s": "DE ∥ BC olduğundan m(∠ADE) = m(∠ABC) = 90°'dir.;;(x + 20°) + (2x + 10°) = 90° ⇒ x = 20 ⇒ m(∠AED) = 50°;;Yöndeş açılar: m(∠ACB) = m(∠AED) = 50°", "f": "f226_4"}, {"n": 5, "t": "Dış açıları kullanarak ABC üçgeninin en büyük iç açısını bulunuz.", "o": {"A": "70°", "B": "74°", "C": "76°", "D": "80°"}, "a": "C", "s": "(2x + 40°) + (3x + 10°) + (5x – 10°) = 360° ⇒ 10x = 320° ⇒ x = 32;;Dış açılar: 104°, 106°, 150°. İç açılar: 76°, 74°, 30°.;;En büyük iç açı: 76°", "f": "f227_1"}, {"n": 6, "t": "|AB| = |AC| ve A'dan geçen d doğrusu BC'ye paraleldir. x kaçtır?", "o": {"A": "80°", "B": "75°", "C": "70°", "D": "85°"}, "a": "A", "s": "d ∥ BC: m(∠B) = 50° (iç ters açılar).;;|AB| = |AC|: m(∠C) = 50°.;;x = m(∠BAC) = 180° – 100° = 80°", "f": "f227_2"}, {"n": 7, "t": "BD ve CE, F'de kesişiyor. x kaçtır?", "o": {"A": "100°", "B": "110°", "C": "120°", "D": "130°"}, "a": "B", "s": "AEC üçgeni: m(∠AEC) = 180° – 60° – 30° = 90°, yani m(∠BEF) = 90°.;;x, BEF üçgeninin bir dış açısıdır.;;x = 90° + 20° = 110°", "f": "f227_3"}, {"n": 8, "t": "ABC, |AB| = |BC| olan bir dik üçgen ve BCD bir eşkenar üçgendir. x kaçtır?", "o": {"A": "10°", "B": "20°", "C": "25°", "D": "15°"}, "a": "D", "s": "|AB| = |BC| = |BD| olduğundan ABD üçgeni ikizkenardır.;;m(∠ABD) = 90° + 60° = 150°;;x = (180° – 150°) ÷ 2 = 15°", "f": "f227_4"}], "ch": 7}], "8": [{"n": 1, "title": "‘Çevremizdeki Açılar’", "qs": [{"n": 1, "t": "Saat 2'de akrep ile yelkovan arasındaki x açısı kaç derecedir?", "o": {"A": "30°", "B": "45°", "C": "60°", "D": "90°"}, "a": "C", "s": "Saat kadranında her saat aralığı 360° ÷ 12 = 30°'dir.;;12'den 2'ye 2 saat aralığı vardır.;;x = 2 · 30° = 60°", "f": "f236_1"}, {"n": 2, "t": "Bir kapı, bir taraftaki duvarla 110°'lik açı yapacak şekilde açılıyor. Kapı ile diğer taraftaki duvar arasındaki x açısı kaç derecedir?", "o": {"A": "60°", "B": "70°", "C": "80°", "D": "110°"}, "a": "B", "s": "Kapı, düz duvar üzerinde iki komşu açı oluşturur.;;x + 110° = 180°;;x = 70°", "f": "f236_2"}, {"n": 3, "t": "Bir makasın ağızları O noktasında çaprazlanıyor ve 35°'lik açı yapıyor. Sapları arasındaki x açısı kaç derecedir?", "o": {"A": "35°", "B": "55°", "C": "145°", "D": "155°"}, "a": "A", "s": "Ağızlar ve saplar ters açılar oluşturur.;;Ters açılar eşittir.;;x = 35°", "f": "f236_3"}, {"n": 4, "t": "Bir pizza merkezden 8 eşit dilime kesiliyor. Bir dilimin x açısı kaç derecedir?", "o": {"A": "45°", "B": "50°", "C": "60°", "D": "90°"}, "a": "A", "s": "8 dilim merkez etrafındaki tam açıyı doldurur.;;x = 360° ÷ 8 = 45°", "f": "f236_4"}, {"n": 5, "t": "Bir demiryolunun iki rayı paraleldir. Bir yol, rayları şekildeki gibi kesiyor. x kaçtır?", "o": {"A": "70°", "B": "90°", "C": "110°", "D": "140°"}, "a": "C", "s": "Raylar paraleldir. 70°'nin alttaki raydaki yöndeşi de 70°'dir.;;x onunla bir doğru üzerindedir: x = 180° – 70° = 110°", "f": "f237_1"}, {"n": 6, "t": "Bir el feneri 50°'lik bir açıyı aydınlatıyor. Işığın orta çizgisi bu açıyı iki eşit parçaya bölüyor. x kaçtır?", "o": {"A": "20°", "B": "25°", "C": "30°", "D": "50°"}, "a": "B", "s": "Orta çizgi, 50°'lik açının açıortayıdır.;;x = 50° ÷ 2 = 25°", "f": "f237_2"}, {"n": 7, "t": "Düz iki cadde birbirini kesiyor. Kavşaktaki karşılıklı iki açı 3x + 15° ve 2x + 40°'dir. x'i bulunuz.", "o": {"A": "20", "B": "25", "C": "30", "D": "35"}, "a": "B", "s": "Karşılıklı iki açı ters açılar olduğundan eşittir.;;3x + 15° = 2x + 40°;;x = 25", "f": "f237_3"}, {"n": 8, "t": "Bir tavan vantilatörünün üç kanadı arasındaki açılar 2x, 3x ve 4x'tir. En büyük açı kaç derecedir?", "o": {"A": "100°", "B": "120°", "C": "140°", "D": "160°"}, "a": "D", "s": "Üç açı tam açıyı doldurur.;;2x + 3x + 4x = 360° ⇒ 9x = 360° ⇒ x = 40°;;En büyük açı: 4x = 160°", "f": "f237_4"}], "ch": 8}, {"n": 2, "title": "‘Çevremizdeki Üçgenler’", "qs": [{"n": 1, "t": "Bir evin çatısı, tepe açısı 110° olan bir ikizkenar üçgendir. x taban açısı kaç derecedir?", "o": {"A": "35°", "B": "45°", "C": "55°", "D": "70°"}, "a": "A", "s": "İkizkenar üçgen: taban açıları eşittir.;;110° + 2x = 180° ⇒ 2x = 70°;;x = 35°", "f": "f238_1"}, {"n": 2, "t": "Bir gönyenin bir dik açısı ve 60°'lik bir açısı var. Üçüncü açısı x kaç derecedir?", "o": {"A": add(0,`<span class="pill">Önsöz</span><div class="ind"><p style="text-indent:0"><b class="t">Sevgili öğrenciler, değerli öğretmenler,</b></p>
<p>Matematik bir dildir ve her dil gibi adım adım öğrenilir. Temel Matematik ve Geometri 1, bu ilk adımları açık, keyifli ve sağlam kılmak için yazıldı. Temel Matematik serisinin ilk kitabıdır ve 5. sınıf ve üzeri için uygundur.</p>
<p>Kitap sekiz bölümden oluşur. Sayılar bölümünde N⁺, N ve Z sayı kümeleriyle tanışacak ve sayıların nasıl sınıflandırıldığını öğreneceksin. 4 İşlem bölümünde pozitif ve negatif sayılarla toplama, çıkarma, çarpma ve bölme yapacak ve bu işlemleri sayı doğrusunda göstereceksin. İşlem Önceliği bölümünde BEDMAS kuralını öğrenecek; parantezli, üslü ve köklü ifadeleri karıştırmadan çözeceksin. Denklemler bölümünde birinci dereceden denklemlerde bilinmeyen x sayısını bulmayı öğreneceksin. Sayı Problemleri bölümünde sözcükleri işlemlere dönüştüreceksin. Doğruda Açılar ve Üçgende Açılar bölümlerinde geometrinin ilk kurallarıyla tanışacak, Günlük Hayatta Geometri bölümünde ise bu kuralları gerçek hayat problemlerini çözmek için kullanacaksın.</p>
<p>Her bölüm aynı dostça planı izler. Bölüm kapağında hedefler, anahtar kelimeler, kısa bir tarihçe notu ve küçük bir araştırma görevi yer alır. Sonraki sayfada konuyla bağlantılı ünlü bir matematikçi tanıtılır. Ardından açık tanımlar, BİLGİ notları, KURAL kutuları ve en kolaydan en zora doğru sıralanmış çok sayıda çözümlü örnek gelir. Alıştırmalar konu anlatımlarını izler; resimli bir sözlük de kapaktaki anahtar kelimeleri açıklar. Kitabın sonundaki cevap anahtarları kendi çalışmanı kontrol etmene yardımcı olur.</p>
<p>Kitapta toplam 196 çözümlü örnek, 20 ek bilgi notu, 17 kural kutusu, 54 alıştırma, 620 soru ve 1.525 seçenek bulunur; hepsi cevap anahtarlıdır ve sınıf içi öğretim ile ek alıştırma için hazırlanmıştır.</p></div>
<p><b class="t"><i>Matematik yolculuğunda başarılar ve keyifli çalışmalar dileriz.</i></b></p><p style="text-align:right"><b class="t">Yazar</b> · <span class="ph">[yer]</span>, <span class="ph">[yıl]</span></p>

/* Tips */
add(0,`<span class="pill">Matematik öğrenmek için ipuçları</span><div class="ind">
<p style="text-indent:0">Matematik öğrenmek bir yolculuğa çıkmaya ya da yepyeni bir oyuna başlamaya çok benzer. Bu kitaptaki her bölümü, bir öncekinden biraz daha zor olan bir seviye gibi düşünebilirsin — tek farkla: bu oyun sayılarla, şekillerle ve sembollerle oynanır. Bazen oyuna yeni semboller katılır (√, π ya da ∞ gibi); bazen sayılar küçülüp başka bir sayının üstüne üs olarak tırmanır; bazen harfler bile sayıların yerini alır. İlk başta bu kafa karıştırıcı gelebilir, tıpkı yepyeni bir oyunun kurallarını öğrenirken olduğu gibi — ama her yeni kural seni bir sonraki seviyeye taşır.</p>
<p>En önemlisi şu: Sen oynarken sayısal düşünme becerin, gündelik durumlara bakış açın ve hatta tepki süren sessizce gelişir. Bir çözüme farklı yollardan ulaşmayı denemeyi, sabırlı olmayı ve mantıklı adımlarla ilerlemeyi öğrenirsin. Bunun günlük hayatına etkisini hemen fark etmeyebilirsin — belki ancak yıllar sonra, hızlıca bir karar tartarken, bir bütçe planlarken ya da karmaşık bir problemi küçük parçalara ayırırken bu becerinin sana ne kadar yardım ettiğini anlayacaksın. Ama etkisi kesinlikle çok büyük olacak ve ömür boyu sürecek.</p>
<p>Matematik öğrenmenin en büyük sırrı aslında çok basittir: <b class="t">asla pes etme.</b> Anlamadığın en küçük ayrıntıyı bile, ne kadar önemsiz görünürse görünsün, öğretmenine sormaktan çekinme — çünkü bugünkü küçük bir boşluk, bir sonraki seviyede büyük bir engele dönüşebilir.</p>
<p>Unutma, her matematikçi de bir zamanlar tıpkı senin gibi bu terimleri ilk kez öğreniyordu. <b class="t">Şimdi sıra sende!</b></p></div>`,'Matematik Öğrenmek İçin İpuçları');

add(1,`<h2 class="h1">1. SAYI KÜMELERİ</h2>

add(2,`<h2 class="h1">2. ‘4’ İŞLEM</h2>
<h3 class="h2">2.1. İşlemlerden Önce Temel Tanımlar</h3>
<p><b class="t">TANIM 1 “İfade”:</b> 5 bir sayıdır, “+” bir işarettir, 13 de bir sayıdır; tabii onları ayrı ayrı düşünürsek. Öte yandan hepsi birlikte bir <u>ifade</u>.</p>
<div class="diag"><div><b>5</b><small>sayı</small></div><div><b>+</b><small>işaret</small></div><div><b>13</b><small>sayı</small></div></div><div class="underl">ifade</div>
<p>“İfade” kelimesini ileride sık sık kullanacağız.</p>
<p><b class="t">TANIM 2 “toplama, çıkarma, çarpma, bölme”:</b> İşlemler, ifadelerin değerini hesaplamayı kolaylaştırır. Matematikte 4 temel işlem vardır.</p>
<p>★ <b>Toplama</b> işlemi “+” (artı) işaretiyle gösterilir.</p><p>Bu işlem çoğunlukla “bir sayı artı bir sayı” diye okunur; “bir sayı ile bir sayının toplamı” da denir.</p>
${E('7 + 15 “yedi artı on beş” ya da “yedi ile on beşin toplamı”')}
<p>★ <b>Çıkarma</b> işlemi “–” (eksi) işaretiyle gösterilir.</p><p>Bu işlem çoğunlukla “bir sayı eksi bir sayı” diye okunur; “bir sayıdan bir sayıyı çıkar” da denir.</p>
${E('19 – 8 “on dokuz eksi sekiz” ya da “on dokuzdan sekizi çıkar”')}
<p>★ <b>Çarpma</b> işlemi “×” ve “.” olmak üzere iki farklı işaretle gösterilir. İki işaret de çarpma işlemini gösterir.</p><p>Bu işlem çoğunlukla “bir sayı çarpı bir sayı” diye okunur; “bir sayı ile bir sayının çarpımı” da denir.</p>
${E('5 × 16 “beş çarpı on altı” ya da “beş ile on altının çarpımı”')}${E('9 . 17 “dokuz çarpı on yedi” ya da “dokuz ile on yedinin çarpımı”')}
<p>★ <b>Bölme</b> işlemi de iki farklı şekilde gösterilebilir: “÷” işaretiyle ve şu şekilde kesirle “${fr('sayı','sayı')}”.</p><p>“÷” işareti kullanıldığında bu işlem “bir sayı bölü bir sayı” diye okunur; kesir kullanıldığında da “bir sayı bölü bir sayı” ya da “kesir çizgisinin üstünde bir sayı, altında bir sayı” diye okunur.</p>
${E('18 ÷ 6 “on sekiz bölü altı”.')}${E(`${fr(72,9)} “Yetmiş iki bölü dokuz”.`)}
<p><b class="t">TANIM 3 “Sayı Doğrusu”:</b> Sayı doğrusu, sanal sayılar dışındaki tüm sayıların üzerinde gösterildiği bir doğrudur.</p>
${nl({})}
<p>Sayı doğrusunda sayılar soldan sağa doğru artar, sağdan sola doğru azalır.</p>
<div class="cap"><span style="color:#d42020">Sayılar sağa doğru artar →</span></div>
${nl({min:0,max:15,groups:[{from:8,to:12,c:'#d42020'},{from:6,to:2,c:'#2563c9'}],noDots:true})}
<div class="cap"><span style="color:#2563c9">← Sayılar sola doğru azalır</span></div>
${I('Sayı doğrusunda 0 başlangıç noktası kabul edilir. Aynı zamanda pozitif sayıları ve negatif sayıları birbirinden ayırır.')}
<p><b class="t">TANIM 4 “Pozitif ve negatif sayılar”:</b> Pozitif sayılar sayı doğrusunda 0'ın sağına yerleştirilir. Negatif sayılar sayı doğrusunda 0'ın soluna yerleştirilir.</p>
${nl({})}<div class="cap"><span style="color:#2563c9">Negatif sayılar</span><span style="color:#d42020">Pozitif sayılar</span></div>
${I('Negatif sayıları gösterirken sayının önüne “–” işareti yazarız.')}
<p><b class="t">TANIM 5 “Ardışık işaretler”:</b> Bir ifadede sayılar arasında birden fazla işaret varsa bu işaretlere ardışık işaretler denir.</p>
${E('7 + – 4; burada “+” ve “–” ardışık işaretlerdir.')}${E('–25 – + 19; burada “–” ve “+” ardışık işaretlerdir.')}
<p>Ardışık işaretlerin yerine aşağıdakileri yazabiliriz;</p>
<p class="ctr">“+ –” yerine “–”<br>“– +” yerine “–”<br>“– –” yerine “+”</p>
${E('71 + – 64, 71 – 64\'e eşittir. “+ –” yerine “–” yazabiliriz.')}${E('– 4 – – 18, – 4 + 18\'e eşittir. “– –” yerine “+” yazabiliriz.')}`,'2. ‘4’ İşlem',1);

add(2,`<h3 class="h2">2.2. Toplama</h3><p>Toplama işlemini 3 farklı durumda inceleyeceğiz.</p>
<h4 class="h3">a. Pozitif sayılarla toplama</h4><p>Sayıları toplayıp sonucu buluruz.</p>
${E('7 + 4 = 11 “7 artı 4 eşittir 11”')}${E('19 + 9 = 28 “19 artı 9 eşittir 28”')}${E('8 + 31 = 39 “8 artı 31 eşittir 39”')}
<h4 class="h3">b. Pozitif ve negatif sayılarla toplama</h4>
<p>★ Pozitif sayı negatif sayıdan büyükse;</p>
${E('5 + – 4<br>“Tanım 5”e göre “+ –” yerine – yazabiliriz.<br>5 + – 4 = 5 – 4 = 1')}
${E('19 + – 7 = 19 – 7 = 12')}${E('37 + – 16 = 37 – 16 = 11')}
${E('–14 + 21<br>Sayıların yerlerini değiştirebiliriz; böylece –14 + 21 yerine 21 – 14 yazabiliriz.<br>–14 + 21 = 21 – 14 = 7')}
${E('–9 + 12 = 12 – 9 = 3')}${E('–71 + 84 = 84 – 71 = 13')}
<p>★ Değer bakımından negatif sayı pozitif sayıdan büyükse;</p>
${R('<br>1. adım; değer bakımından büyük olan sayıyı belirle.<br>2. adım; büyük sayının işaretini sonucun işareti olarak yaz.<br>3. adım; küçüğü büyükten çıkar.<br>4. adım; 3. adımın sonucunu sonucun işaretinden sonra yaz.')}
${E('11 + – 19<br>1. adım; değer bakımından büyük olan sayıyı belirle. 19, 11\'den büyüktür.<br>2. adım; büyük sayının işaretini sonucun işareti olarak yaz. 19\'un işareti “–” olduğu için sonucun işareti “–” olacaktır.<br>3. adım; küçüğü büyükten çıkar. 19 – 11 = 8<br>4. adım; 3. adımın sonucunu sonucun işaretinden sonra yaz.<br>11 + – 19 = 11 – 19 = –8')}
${E('24 + – 37<br>1. adım; 37, 24\'ten büyüktür<br>2. adım; 37\'nin işareti “–”dir.<br>3. adım; 37 – 24 = 13<br>4. adım; 24 + – 37 = 24 – 37 = –13')}
${E('41 + – 52 = – 11')}${E('77 + – 84 = – 7')}
${E('–44 + 37<br>1. adım; 44, 37\'den büyüktür.<br>2. adım; 44\'ün işareti “–”dir.<br>3. adım; 44 – 37 = 7<br>4. adım; –44 + 37 = –7.')}
${E('–56 + 41 = –15')}${E('–79 + 48 = –31')}
<h4 class="h3">c. Negatif sayılarla toplama</h4>
${R('<br>1. adım; sonucun işareti olarak “–” yaz.<br>2. adım; sayıları topla ve sonucu, sonucun işaretinden sonra yaz.<br>3. adım; ifadenin sonucunu göster.')}
${E('–4 + –19<br>1. adım; sonucun işareti olarak “–” yaz. –4 + –19 = –<br>2. adım; sayıları topla ve sonucu, sonucun işaretinden sonra yaz. 4 + 19 = 23<br>3. adım; ifadenin sonucunu göster. –4 + –19 = –23')}
${E('–23 + – 14<br>1. adım; –23 + – 14 = –<br>2. adım; 23 + 14 = 37<br>3. adım; –23 + – 14 = –37')}
${E('– 4 + – 51 = – 55')}${E('– 43 + – 16 = –59')}`,'2.2. Toplama',2);

add(2,`<h3 class="h2">2.3. Çıkarma</h3><p>Çıkarma işlemini 4 durumda inceleyeceğiz.</p>
<h4 class="h3">a. Negatif bir sayıdan negatif bir sayı çıkarma</h4>
${E('– 8 – – 13<br>“– –” yerine “+” yazabiliriz<br>– 8 – – 13 = – 8 + 13 = 5')}${E('–14 – – 9 = –14 + 9 = –5')}${E('–44 – – 57 = –44 + 57 = 13')}
<h4 class="h3">b. Negatif bir sayıdan pozitif bir sayı çıkarma</h4>
${E('–9 – + 4 = – 9 – 4 = –13')}${E('–14 – + 19 = –14 – 19 = –33')}${E('–101 – + 79 = –101 – 79 = –180')}
<h4 class="h3">c. Pozitif bir sayıdan negatif bir sayı çıkarma</h4>
${E('5 – – 15 = 5 + 15 = 20')}${E('13 – – 24 = 13 + 24 = 37')}${E('76 – – 19 = 76 + 19 = 95')}
<h4 class="h3">d. Pozitif bir sayıdan pozitif bir sayı çıkarma</h4>
${E('16 – 9 = 7')}${E('21 – 17 = 4')}${E('33 – 45 = –12')}${E('9 – 18 = –9')}${E('78 – 59 = 19')}${E('34 – 67 = –33')}`,'2.3. Çıkarma',2);

add(2,`<h3 class="h2">2.4. Sayı doğrusunda toplama ve çıkarma</h3>
${R('<br>1. adım: İlk sayıyı sayı doğrusunda işaretle.<br>2. adım: İşleme göre, işlem toplama ise sağa, çıkarma ise sola git.<br>3. adım: Sonuç, durduğun son nokta olacaktır.')}
${E(`2 + 4<br>1. adım: İlk sayıyı sayı doğrusunda işaretle.${nl({dot:2})}2. adım: +4'ün anlamı 4 kez sağa gitmektir.${nl({from:2,to:6})}3. adım: Durduğumuz son nokta 6'dır. Bu yüzden sonuç 6'dır.`)}
${E(`3 + – 5<br>1. adım:${nl({dot:3})}2. adım: “+ –” yerine “–” yazabiliriz. 3 + – 5 = 3 – 5<br>–5'in anlamı 5 kez sola gitmektir.${nl({from:3,to:-2})}3. adım: Sonuç –2'dir.`)}
${E(`–6 + 5 = –1${nl({from:-6,to:-1})}`)}
${E(`–1 + – 6<br>–1 + – 6 = –1 – 6 = –7${nl({from:-1,to:-7})}`)}
${E(`5 – + 6 = 5 – 6 = –1${nl({from:5,to:-1})}`)}
${E(`–4 – – 7<br>–4 – – 7 = –4 + 7 = 3${nl({from:-4,to:3})}`)}
${I('İpucu: Atlamaları yeniden izlemek için bir sayı doğrusuna dokun.')}`,'2.4. Sayı doğrusunda toplama ve çıkarma',2);

add(3,`<h2 class="h1">3. İŞLEM ÖNCELİĞİ</h2>
<p>İşlemler sorularda karışık olarak verilebilir. Bu durumda işlemler arasındaki sıraya uymamız gerekir. Bu tür soruları kolayca çözmek için temel bir kuralımız var. Bu temel kurala “BEDMAS” denir (İngilizce baş harflerinden oluşan bir kısaltmadır).</p>
<p><b class="t">1. “B”</b> parantezleri (Brackets) gösterir. Bazı parantez türleri şunlardır; ( , ) , [ , ] , { , } .</p>
<p>Parantezleri gördüğünde önce parantezin içini çözmeye başlamalısın. Parantezler işlemler arasında ilk sırayı alır. Soruları parantezlerin içinden başlayarak çözersin.</p>
<p><b class="t">2. “E”</b> üslü ve köklü ifadeleri (Exponentials) gösterir. Üslü ve köklü ifadelere bazı örnekler;</p><p class="ctr">2⁴, 5², ${r(16)}, ${r(50)}</p>
<p>Üslü ve köklü ifadeleri gördüğünde, onları çarpma, bölme, toplama ve çıkarmadan önce hesaplamaya başlamalısın.</p>
<p><b class="t">3. “D”</b> bölme işlemini (Division), <b class="t">“M”</b> ise çarpma işlemini (Multiplication) gösterir. Bölme ve çarpma işlemlerine bazı örnekler;</p><p class="ctr">5 × 2, 10 ÷ 2, 11 . –2, 72 : 9.</p>
<p>Çarpma ve bölme işlemlerini gördüğünde, onları toplama ve çıkarmadan önce hesaplamaya başlamalısın.</p>
<p><b class="t">4. “A”</b> toplama işlemini (Addition), <b class="t">“S”</b> ise çıkarma işlemini (Subtraction) gösterir. Toplama ve çıkarma işlemlerine bazı örnekler;</p><p class="ctr">15 – 2, –7 + 5, 14 – –23, 8 – 17.</p>
<p>Şimdi yukarıdaki açıklamaya göre en kolaydan en zora doğru örneklere göz atacağız.</p>
<p>Bu kitapta sorular zorluk düzeylerine göre türlere ayrılmıştır.</p>
<h3 class="h2">TÜR 1: Yalnızca toplama ve çıkarma içeren</h3>
<p><b class="t">Açıklama;</b> Bir ifadede yalnızca toplama ve çıkarma görüyorsan hangi işlemden başladığının önemi yoktur.</p>
${E('11 + 7 + 5<br>11 + 7, 18 eder ve 18 + 5, 23 eder. Önce 7 ile 5\'i, sonra 11\'i de toplayabilirsin. Aynı sonucu bulursun.')}
${E('8 – 9 + 4<br>8 – 9, –1\'e eşittir. –1 + 4, 3\'e eşittir.<br>Önce –9 ile 4\'ü, sonra 8\'i de toplayabilirsin. Aynı sonucu bulursun.')}
${E('–18 + 3 + 25 – 6<br>–18 + 3 = –15. –15 + 25 = 10. 10 – 6 = 4.')}
${E('4 – –12 + 5<br>çift – işareti + olur. 4 + 12, 16 eder. 16 + 5, 21 eder.')}
${E('–21 + 17 + –2 + 8 – 11<br>–21 + 17 = –4. –4 + – 2 = – 6. –6 + 8 = 2. 2 – 11 = –9.')}
<h3 class="h2">TÜR 2: Yalnızca çarpma ve bölme içeren</h3>
<p><b class="t">Açıklama;</b> Aynı ifadede yalnızca çarpma ve bölme görüyorsan soldan sağa doğru başla.</p>
${E('12 : 4 × 3<span class="nosay"><br><span style="color:#19a34a;font-weight:900">12 : 4 × 3 &nbsp;⟶</span></span><br>Bölmeden başla. 12 : 4, 3 eder. 3 × 3, 9 eder.')}
${W('Sağdan sola ya da ifadenin ortasından başlarsan yanlış sonucu bulursun. Örneğin;<br><span style="color:#e03131;font-weight:900">⟵&nbsp; 12 : 4 × 3</span><br>12 : 12 = 1. 1 yanlış bir cevaptır.','Bu ÇOK ÖNEMLİ:')}
${E('12 × 4 : 3 : 8<br>12 × 4 = 48. 48 : 3 = 16. 16 : 8 = 2.')}${E('72 : 9 × 3<br>72 : 9 = 8. 8 × 3 = 24.')}${E('7 × 4 : 14<br>7 × 4 = 28. 28 : 14 = 2.')}${E('24 : 6 × 2 : 4<br>24 : 6 = 4. 4 × 2 = 8. 8 : 4 = 2.')}
<h3 class="h2">TÜR 3: TÜR 1 ve 2'yi içeren</h3>
<p><b class="t">Açıklama;</b> BEDMAS kuralına göre bu 4 işlemin hepsini aynı ifadede gördüğünde çarpma ve bölmeden başlamalısın.</p>
${E('9 + 14 : 2<br>Önce bölme; 14 : 2, 7 eder. 9 + 7, 16 eder.')}
${E('12 × 2 + 4 – 26 : 2<br>Önce çarpma ve bölme. 12 × 2, 24 eder ve 26 : 2, 13 eder. Şimdi ifade şöyle yeniden yazılabilir; 24 + 4 – 13. Böylece 24 + 4, 28 eder ve 28 – 13, 15 eder.')}
${E('14 – 36 : 9 × 5 + 8<br>Bu soruda bölme ve çarpma art arda verilmiştir. Burada tür 2 kuralını kullanmalısın.<br>Önce bölme, sonra çarpma. 36 : 9, 4 eder ve 4 × 5, 20 eder. İfade şöyle yazılabilir; 14 – 20 + 8. 14 – 20, – 6 eder. – 6 + 8, 2 eder.')}`,'3. İşlem Önceliği',1);
P[P.length-1].sub=[['Tür 1: Yalnızca toplama ve çıkarma içeren',2],['Tür 2: Yalnızca çarpma ve bölme içeren',2],['Tür 3: Tür 1 ve 2\'yi içeren',2]];

add(3,`<h3 class="h2">TÜR 4: ÜSLÜ VE KÖKLÜ İFADELER İÇEREN TÜR 1, 2, 3</h3>
<p>Tür 4 soruları çözmeden önce üslü ve köklü ifadelerin temel açıklamaları ve tanımları bilinmelidir. Bu iki başlık “Temel Matematik ve Geometri III” kitabında daha ayrıntılı açıklanacaktır.</p>
<h4 class="h3">1. Üslü İfadeler</h4>
<p>Bir sayı kendisiyle birçok kez çarpılmışsa bunu kısaca bir ifade olarak gösterebiliriz. Bu ifadeye üslü ifade denir.</p>
${E('3×3×3×3×3 üslü olarak gösterilebilir. Bu örnekte 3, 5 kez çarpılmıştır. 3\'e taban, 5\'e üs ya da kuvvet denir.<br>Şöyle gösterilir; 3×3×3×3×3 = 3⁵<div class="nosay" style="font-size:34px;font-weight:900;margin:6px 0 0 10px">3<sup style="font-size:20px;color:#d42020">5</sup> <small style="font-size:14px;color:#d42020">← üs</small></div><small class="nosay" style="color:#2563c9;font-weight:900;margin-left:10px">↑ taban<br></small>3⁵ “3 üssü 5” diye okunur<br>Taban hangi sayıyı çarpman gerektiğini, üs ise kaç kez çarpacağını gösterir.')}
${E('7×7×7×7<br>7×7×7×7 = 7⁴ “7 üssü 4”')}${E('1×1×1×1×1×1×1×1<br>1×1×1×1×1×1×1×1 = 1⁸ “1 üssü 8”')}${E('2³\'ün değeri nedir?<br>2³ = 2×2×2 = 8')}
${W('2³, 2 × 3 <u>değildir</u> ve sonuç 6\'ya eşit <u>değildir</u>.')}
<h4 class="h3">2. Köklü İfadeler</h4>
<p><b class="t">BÖLÜM 1 “Kök işareti ve kök derecesi”</b></p><p>“√” bu bir kök işaretidir.</p>
<div class="rootd"><span style="color:#d42020;font-weight:800">Kök derecesi →</span><span class="rbig"><i></i><span class="rad"><span class="rs"></span><span class="ri"><u></u></span></span></span><span style="color:#2563c9;font-weight:800">← Kök içindeki sayı</span></div>
<p>Kök derecesinin yerinde bir şey yoksa onun her zaman 2 olduğunu kabul ederiz. Bunu “karekök” ya da çoğunlukla sadece “kök” diye okuruz.</p>
<p>√ ve ²√ aynı ifadelerdir ama her zaman √ olanı kullanırız.</p><p>${r(7)} “kök yedi” diye okunur</p>
<p><b class="t">BÖLÜM 2 “Kök içindeki sayı”</b></p>
<p>Kök içindeki sayısı bir kare sayı olan köklerle karşılaşacağız.</p><p>Önce şunu öğrenmeliyiz: <b>kare sayılar nedir?</b></p>
<p>Kare sayılar, başka bir sayının karesi olarak gösterilebilen sayılardır. Örneğin;</p>
<p>4 bir kare sayıdır, çünkü 4, 2'nin karesidir.</p><p class="ctr">4 = 2²</p><p>49 bir kare sayıdır, çünkü 49, 7'nin karesidir.</p><p class="ctr">49 = 7²</p>
<p>Böylece ${r(25)} “karesi 25 olan sayı hangisidir?” anlamına gelir. Sorunun cevabı 5'tir. Bu yüzden doğrudan şunu yazabiliriz: ${r(25)} = 5.</p>
${E(`${r(100)} = 10, ${r(64)} = 8, ${r(81)} = 9, ${r(9)} = 3, ${r(121)} = 11`)}
<p>Artık tür 1, 2, 3 ile tür 4'ü birleştirebiliriz.</p>
<p><b class="t">Açıklama:</b> tür 1, 2, 3'te öğrendiğimiz kuralların aynısı izlenecek. Üslü ve köklü ifadeleri çarpma, bölme, toplama ve çıkarma işlemlerinden önce hesaplayacağız.</p>
${E(`${r(16)} : 2 + 8 – 5²<br>${r(16)} ve 5² köklü ve üslü ifadelerdir. Önce onları hesapla.<br>${r(16)} : 2 + 8 – 5² = 4 : 2 + 8 – 25<br>Önce bölmeyi, sonra toplama ve çıkarmayı hesaplamalısın.<br>4 : 2 + 8 – 25 = 2 + 8 – 25 = 10 – 25 = –15`)}
${E(`2³ × ${r(9)} + 4² : 2 – 10 + 8<br>Önce üslü ve köklü ifadeleri hesapla,<br>2³ × ${r(9)} + 4² : 2 – 10 + 8 = 8 × 3 + 16 : 2 – 10 + 8<br>Sonra çarpma ve bölmeyi hesapla.<br>8 × 3 + 16 : 2 – 10 + 8 = 24 + 8 – 10 + 8 = 32 – 10 + 8 = 30`)}
${E(`3³ : ${r(9)} × 2² – ${r(25)} + 20 – 8²<br>Önce üslü ve köklü ifadeleri hesapla,<br>3³ : ${r(9)} × 2² – ${r(25)} + 20 – 8² = 27 : 3 × 4 – 5 + 20 – 64<br>Sonra çarpma ve bölmeyi hesapla. (BURADA TÜR 2 KURALINA DİKKAT ET)<br>27 : 3 × 4 – 5 + 20 – 64 = 9 × 4 – 5 + 20 – 64<br>= 36 – 5 + 20 – 64 = 31 – 44 = – 13.`)}
${E(`${r(36)} + ${r(49)} – 13 + ${r(169)} – 2⁴ : 4<br>Önce üslü ve köklü ifadeleri hesapla,<br>= 6 + 7 – 13 + 13 – 16 : 4<br>Sonra çarpma ve bölmeyi hesapla.<br>= 6 + 7 – 13 + 13 – 4 = 13 – 13 + 13 – 4 = 13 – 4 = 9.`)}
${E(`${r('13 + 12')} × 2⁴ – 6² – ${r('8² – 5 × 3')}<br>Bu soruda köklerin içinde başka ifadeler var. Öğrendiğimiz gibi önce köklü ifadeleri çözmeliyiz, bu yüzden önce köklerin içini çözmeliyiz.<br>= ${r(25)} × 2⁴ – 6² – ${r('64 – 15')}<br>= ${r(25)} × 2⁴ – 6² – ${r(49)}<br>Şimdi köklü ve üslü ifadeleri hesaplayabiliriz.<br>${r(25)} × 2⁴ – 6² – ${r(49)} = 5 × 16 – 36 – 7<br>Sonra çarpmayı hesapla.<br>5 × 16 – 36 – 7 = 80 – 36 – 7 = 44 – 7 = 37.`)}
${E(`5³ – ${r('10² + 23 × 3')} + (4 + 2)²<br>${r('10² + 23 × 3')} = ${r('100 + 69')} = ${r(169)} = 13<br>5³ – ${r('10² + 23 × 3')} + (4 + 2)² = 125 – 13 + 36 = 148.`)}
${E(`(14 – 3²)² + ${r('22 – 16 + 30')} – 7² + ${r(144)}<br>(14 – 3²)² = (14 – 9)² = 5² = 25<br>${r('22 – 16 + 30')} = ${r(36)} = 6<br>(14 – 3²)² + ${r('22 – 16 + 30')} – 7² + ${r(144)} = 25 + 6 – 49 + 12 = – 6`)}`,'Tür 4: Üslü ve köklü ifadeler içeren Tür 1, 2, 3',2);

add(3,`<h3 class="h2">TÜR 5: TÜM TÜRLERİ VE PARANTEZLERİ İÇEREN</h3>
<p>Her zaman önce parantezin içini çözeceğiz ve BEDMAS kuralını kullanacağız.</p>
${E('( 3 + 1 ) × 2<br>Önce parantezin içi, sonra diğerleri BEDMAS kuralına göre.<br>( 3 + 1 ) × 2 = 4 × 2 = 8.')}
${E(`( 4 – 1 + 3² ) – ${r(16)} : 2²<br>Önce parantezin içi, sonra diğerleri BEDMAS kuralına göre.<br>( 4 – 1 + 3² ) = ( 3 + 9 ) = 12<br>( 4 – 1 + 3² ) – ${r(16)} : 2² = 12 – 4 : 4 = 12 – 1 = 11.`)}
${E(`[4 – (8² : ${r(64)} + 10) × 2] × (– 2 – 1 × 4) + – 11<br>Önce parantezin içi, sonra diğerleri BEDMAS kuralına göre.<br>(8² : ${r(64)} + 10) = 64 : 8 + 10 = 8 + 10 = 18<br>[4 – (8² : ${r(64)} + 10) × 2] = 4 – 18 × 2 = 4 – 36 = – 32<br>(– 2 – 1 × 4) = – 2 – 4 = – 6<br>[4 – (8² : ${r(64)} + 10) × 2] × (– 2 – 1 × 4) + – 11 =<br>= – 32 × – 6 + – 11 = 192 – 11 = 181.`)}
<p style="text-align:center;font-size:44px;margin:24px 0 0">B · E · D M · A S</p>
<p class="ctr" style="color:#888">Parantezler → Üslü ve köklü ifadeler → Bölme ve çarpma (soldan sağa) → Toplama ve çıkarma</p>`,'Tür 5: Tüm türleri ve parantezleri içeren',2);

add(5,`<h2 class="h1">4. DENKLEMLER</h2>
<p>Bu bölümde bir bilinmeyenli birinci dereceden denklemlerle uğraşacağız.</p>
<p><b class="t">Tanım 1 “Bilinmeyen Sayı”:</b> Değerini bilmediğimiz sayıların yerine bazı harfler veririz. Bu tür sayılara bilinmeyen sayılar denir. Sonra bu bilinmeyen sayıyı bulmak için bazı kurallar kullanırız. En bilinen bilinmeyen sayı “x”tir.</p>
<p><b class="t">Tanım 2 “Eşitlik”:</b> “=” işareti, denklemin iki tarafının birbirine eşit olduğunu göstermek için kullanılır.</p>
<div class="diag"><div><b>x + 8</b><small>Sol taraf</small></div><div><b>=</b><small>Eşittir işareti</small></div><div><b>10</b><small>Sağ taraf</small></div></div>
<p>Yani bilinmeyen x sayısı denklemi sağlamalı ve eşitlik korunmalıdır.</p>
<p><b class="t">Tanım 3 “Cevap, Çözüm ve x'in Değerini Bulma”:</b> Sorunun cevabını, çözümünü ya da bilinmeyen “x” sayısının değerini bulmak için (bu üçü aynı anlama gelir) x'i bir tarafta yalnız bırakmamız gerekir. Bunun için tüm sayıları bir tarafta, tüm “x”leri diğer tarafta toplamalıyız.</p>
<p>Denklem çözme kurallarına göz atalım;</p>
<h3 class="h2">Kural 1 “Pozitif ve Negatif Sayıları Karşı Tarafa Geçirme”</h3>
${R('Pozitif bir sayı soldan sağa ya da sağdan sola geçirilirse “negatif” olur.')}
${E('5 + x = 8. Denklemi çözünüz.<br>+5\'i sol taraftan sağ tarafa geçirmemiz gerekir. Bu yüzden işareti negatif olur.<br>x = 8 – 5<br>Sonra sağ tarafı hesaplayıp cevabı bulalım.<br>x = 3<br>Soru çözüldü ve cevap 3 olarak bulundu.','Örnek 1:')}
${E('14 = 9 + x. x\'in değerini bulunuz.<br>14 – 9 = x<br>5 = x')}
${E('x + 16 = 19 denklemini çözünüz.<br>x = 19 – 16<br>x = 3')}
${R('Negatif bir sayı soldan sağa ya da sağdan sola geçirilirse “pozitif” olur.')}
${E('x – 4 = 3<br>x = 3 + 4<br>x = 7')}
